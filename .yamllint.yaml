extends: default
ignore: |
  k8s/**/rendered/
  k8s/**/*.enc.yaml
  .github/workflows/
  # Embedded verbatim in a ConfigMap as AdGuardHome.yaml: a document start would change the app's config
  k8s/apps/adguard/adguard-config.yaml
rules:
  line-length: disable
  document-start: enable
  truthy:
    check-keys: false
  comments: disable
  comments-indentation: disable
  indentation: {spaces: 2}
  braces:
    max-spaces-inside: 1
  empty-lines:
    max: 2
