name: Setup Trivy
description: Installs a pinned Trivy release after verifying its published SHA-256 checksum.
inputs:
  version:
    description: Trivy version including the leading v, e.g. v0.76.2
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        dir="$(mktemp -d)"
        base="https://github.com/aquasecurity/trivy/releases/download/${VERSION}"
        archive="trivy_${VERSION#v}_Linux-64bit.tar.gz"
        curl -fsSL --retry 3 -o "${dir}/${archive}" "${base}/${archive}"
        curl -fsSL --retry 3 -o "${dir}/checksums.txt" "${base}/trivy_${VERSION#v}_checksums.txt"
        (cd "${dir}" && grep -F " ${archive}" checksums.txt | sha256sum --check --strict -)
        mkdir -p "${HOME}/.local/bin"
        tar -xzf "${dir}/${archive}" -C "${HOME}/.local/bin" trivy
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
