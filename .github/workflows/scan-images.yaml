name: Scan changed images

# Scans the container images a PR adds or re-tags under k8s/ with Trivy and posts one comment with the
# CRITICAL/HIGH vulnerability delta per image. Informational: it never blocks the PR.
# Manual runs scan every image under k8s/ (no comparison) and only write the job summary.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "k8s/**"
      - "scripts/ci/scan-images.py"
      - ".github/workflows/scan-images.yaml"

concurrency:
  group: scan-images-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.76.2 # renovate: datasource=github-releases depName=aquasecurity/trivy
  PYYAML_VERSION: "6.0.3" # renovate: datasource=pypi depName=PyYAML

permissions:
  contents: read

jobs:
  extract:
    name: Find changed images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.extract.outputs.images }}
      count: ${{ steps.extract.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the merge base
          persist-credentials: false
      - name: Install PyYAML
        run: pip install --quiet "pyyaml==${PYYAML_VERSION}"
      - name: Extract new and re-tagged images
        id: extract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            python scripts/ci/scan-images.py extract --base "${BASE_SHA}"
          else
            python scripts/ci/scan-images.py extract --all
          fi

  trivy-db:
    # Download the vulnerability databases once; the scan jobs only restore them (no registry rate limits).
    name: Fetch Trivy database
    needs: extract
    if: needs.extract.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Date
        id: date
        run: echo "date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"
      - name: Cache databases
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.date.outputs.date }}
      - name: Setup Trivy
        if: steps.cache.outputs.cache-hit != 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Download databases
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          trivy image --cache-dir "${RUNNER_TEMP}/trivy-cache" --download-db-only
          trivy image --cache-dir "${RUNNER_TEMP}/trivy-cache" --download-java-db-only

  scan:
    name: Scan ${{ matrix.image.ref }}
    needs: [extract, trivy-db]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.extract.outputs.images) }}
    permissions:
      contents: read
      packages: read # pull ghcr.io/cthtrifork/* images
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Date
        id: date
        run: echo "date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"
      - name: Restore Trivy databases
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.date.outputs.date }}
          fail-on-cache-miss: true
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Install PyYAML
        run: pip install --quiet "pyyaml==${PYYAML_VERSION}"
      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan images
        # Image references come from the PR's manifests, so they only reach the shell through env.
        env:
          NEW_REF: ${{ matrix.image.ref }}
          OLD_REF: ${{ matrix.image.oldref }}
          ENTRY: ${{ toJson(matrix.image) }}
          ID: ${{ matrix.image.id }}
        run: |
          mkdir -p out
          scan() { # <image> <output file>; a failed scan leaves no file and is reported in the comment
            trivy image --quiet --format json --output "$2" \
              --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
              --ignore-status not_affected,will_not_fix \
              --cache-dir "${RUNNER_TEMP}/trivy-cache" --skip-db-update --skip-java-db-update \
              "$1" || echo "::warning::Trivy could not scan $1"
          }
          scan "${NEW_REF}" out/new.json
          if [ -n "${OLD_REF}" ]; then
            scan "${OLD_REF}" out/old.json
          fi
          python scripts/ci/scan-images.py compare --entry "${ENTRY}" \
            --new out/new.json --old "$([ -f out/old.json ] && echo out/old.json)" \
            --out "out/summary-${ID}.json"
      - name: Upload summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-${{ matrix.image.id }}
          path: out/summary-*.json
          retention-days: 7

  report:
    name: Report
    needs: [extract, scan]
    if: always() && needs.extract.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the sticky PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: pip install --quiet "pyyaml==${PYYAML_VERSION}"
      - name: Download summaries
        if: needs.extract.outputs.count != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-*
          path: summaries
          merge-multiple: true
      - name: Build report
        run: |
          mkdir -p summaries
          python scripts/ci/scan-images.py report --dir summaries --out report.md
          cat report.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Comment on the PR
        # Fork PRs get a read-only token; the job summary above still has the report.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          COUNT: ${{ needs.extract.outputs.count }}
        run: |
          # One comment, updated in place on every push.
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.body | contains("<!-- scan-images -->")) | .id' | head -n1)"
          if [ -n "${existing}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@report.md
          elif [ "${COUNT}" != "0" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@report.md
          fi

  scan-complete:
    # Stable single check to require in branch protection: the scan job is skipped when no image changed.
    name: Image scan complete
    needs: [extract, trivy-db, scan, report]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          case " ${RESULTS} " in *" failure "* | *" cancelled "*) exit 1 ;; esac
