name: Scan changed images

# Scans the container images a PR adds or re-tags under k8s/ with Trivy and posts one comment with the
# CRITICAL/HIGH vulnerability delta per image. Informational: it never blocks the PR.
# Manual runs scan every image under k8s/ (no comparison) and only write the job summary.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "k8s/**"
      - "scripts/ci/extract-images.py"
      - "scripts/ci/scan-images-section.sh"
      - ".github/workflows/scan-images.yaml"

concurrency:
  group: scan-images-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYYAML_VERSION: "6.0.3" # renovate: datasource=pypi depName=PyYAML
  TRIVY_VERSION: v0.76.2 # renovate: datasource=github-releases depName=aquasecurity/trivy

permissions:
  contents: read

jobs:
  extract:
    name: Find changed images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.extract.outputs.images }}
      count: ${{ steps.extract.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the old manifests are read from the base commit
          persist-credentials: false
      - name: Get changed k8s YAML files
        id: changed
        if: github.event_name == 'pull_request'
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files: |
            k8s/**/*.{yaml,yml}
          files_ignore: |
            k8s/**/kyverno-policies/**
            k8s/**/policies/tests/**
          separator: "\n"
      - name: Install PyYAML
        run: pip install --quiet "pyyaml==${PYYAML_VERSION}"
      - name: Extract changed images
        # Compares each changed file with its version on the base commit. Manual runs list every image.
        id: extract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            mapfile -t files <<< "${CHANGED_FILES}"
            python scripts/ci/extract-images.py --base "${BASE_SHA}" "${files[@]}" > images.json
          else
            python scripts/ci/extract-images.py --all > images.json
          fi
          jq -r '.[] | "\(.oldref) -> \(.ref)"' images.json
          echo "images=$(cat images.json)" >> "${GITHUB_OUTPUT}"
          echo "count=$(jq length images.json)" >> "${GITHUB_OUTPUT}"

  trivy-db:
    # Download the vulnerability databases once; the scan jobs only restore them (no registry rate limits).
    name: Fetch Trivy database
    needs: extract
    if: needs.extract.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Date
        id: date
        run: echo "date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"
      - name: Cache databases
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.date.outputs.date }}
      - name: Setup Trivy
        if: steps.cache.outputs.cache-hit != 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Download databases
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          trivy image --cache-dir "${RUNNER_TEMP}/trivy-cache" --download-db-only
          trivy image --cache-dir "${RUNNER_TEMP}/trivy-cache" --download-java-db-only

  scan:
    name: Scan ${{ matrix.image.ref }}
    needs: [extract, trivy-db]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.extract.outputs.images) }}
    permissions:
      contents: read
      packages: read # pull ghcr.io/cthtrifork/* images
      pull-requests: write # the PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Date
        id: date
        run: echo "date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"
      - name: Restore Trivy databases
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.date.outputs.date }}
          fail-on-cache-miss: true
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan images
        # Image references come from the PR's manifests, so they only reach the shell through env.
        env:
          NEW_REF: ${{ matrix.image.ref }}
          OLD_REF: ${{ matrix.image.oldref }}
          FILES: ${{ join(matrix.image.files, '`, `') }}
          ID: ${{ matrix.image.id }}
        run: |
          mkdir -p out
          scan() { # <image> <output file>; a failed scan leaves no file and is reported in the comment
            trivy image --quiet --format json --output "$2" \
              --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
              --ignore-status not_affected,will_not_fix \
              --cache-dir "${RUNNER_TEMP}/trivy-cache" --skip-db-update --skip-java-db-update \
              "$1" || echo "::warning::Trivy could not scan $1"
          }
          scan "${NEW_REF}" out/new.json
          if [ -n "${OLD_REF}" ]; then
            scan "${OLD_REF}" out/old.json
          fi
          # The report is an unzipped artifact, so its file name is the artifact name.
          name="$(sed -E 's/@.*$//; s/[^A-Za-z0-9._-]+/_/g' <<< "${NEW_REF}")"
          echo "report=out/${ID}-${name}.md" >> "${GITHUB_ENV}"
          ./scripts/ci/scan-images-section.sh "${NEW_REF}" "${OLD_REF}" "\`${FILES}\`" \
            out/new.json out/old.json out/comment.md "out/${ID}-${name}.md"
      - name: Upload full report
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.report }}
          archive: false
          retention-days: 14
      - name: Add report link
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '\n[Full vulnerability report for the new image](%s) (Markdown artifact)\n' "${URL}" >> out/comment.md
          cat out/comment.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Comment on the PR
        # One comment per image, updated in place. Fork PRs get a read-only token; the job summary has the same text.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          NEW_REF: ${{ matrix.image.ref }}
        run: |
          marker="<!-- scan-images: ${NEW_REF%%@*} -->"
          { echo "${marker}"; cat out/comment.md; } > body.md
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)"
          if [ -n "${existing}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@body.md
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@body.md
          fi

  scan-complete:
    # Stable single check to require in branch protection: the scan job is skipped when no image changed.
    name: Image scan complete
    needs: [extract, trivy-db, scan]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          case " ${RESULTS} " in *" failure "* | *" cancelled "*) exit 1 ;; esac
