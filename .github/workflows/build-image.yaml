name: Build and publish container images

# Versioning (see docs/releasing.md):
#   - Tag push vX.Y.Z (made by publishing the draft release): images get vX.Y.Z, vX.Y, vX and latest.
#     A pre-release tag (vX.Y.Z-rc.1) gets only its own tag, so the floating tags and latest stay on stable.
#   - Manual run: <tag prefix>-<short sha>, for example rc-1a2b3c4d. Never a release tag.
#   - Pull request: built to check it, not pushed.

on:
  pull_request:
    branches:
      - main
    paths:
      - images/github-actions-runner/**
      - images/claude-runner/**
      - images/fileserver/**
      - .github/workflows/build-image.yaml
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # v1.2.3, or v1.2.3-rc.1 for a pre-release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag prefix (the short commit SHA is appended)'
        default: 'rc'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUNNER_VERSION: "2.338.2" # renovate: datasource=github-releases depName=actions/runner

jobs:
  build-and-publish:
    name: Build and publish (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One output per image: matrix legs cannot share a single output name.
    outputs:
      image_url_github-actions-runner: ${{ steps.slsa.outputs.image_url_github-actions-runner }}
      image_digest_github-actions-runner: ${{ steps.slsa.outputs.image_digest_github-actions-runner }}
      image_url_claude-runner: ${{ steps.slsa.outputs.image_url_claude-runner }}
      image_digest_claude-runner: ${{ steps.slsa.outputs.image_digest_claude-runner }}
      image_url_fileserver: ${{ steps.slsa.outputs.image_url_fileserver }}
      image_digest_fileserver: ${{ steps.slsa.outputs.image_digest_fileserver }}
    permissions:
      contents: read
      id-token: write # for creating OIDC tokens for signing.
      packages: write # for pushing and signing container images.
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: github-actions-runner
            containerfile: images/github-actions-runner/Dockerfile
            context: images/github-actions-runner
            registryurl: ghcr.io/${{ github.repository }}/github-actions-runner
          - name: claude-runner
            containerfile: images/claude-runner/Dockerfile
            context: images/claude-runner
            registryurl: ghcr.io/${{ github.repository }}/claude-runner
          - name: fileserver
            containerfile: images/fileserver/Dockerfile
            context: images/fileserver
            registryurl: ghcr.io/${{ github.repository }}/fileserver
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute build date and dispatch tag
        id: prep
        env:
          TAG_PREFIX: ${{ inputs.tag }}
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "DEV_TAG=${TAG_PREFIX:-rc}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image.registryurl }}
          # Keep the v prefix: deployed manifests reference tags like v0.6.1.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=${{ steps.prep.outputs.DEV_TAG }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.created=${{ steps.prep.outputs.BUILD_DATE }}

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image${{ env.PUBLISH == 'true' && ' and push to GHCR' || ' (no push on pull requests)' }}
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image.context }}
          file: ./${{ matrix.image.containerfile }}
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          build-args: |
            RUNNER_VERSION=${{ env.RUNNER_VERSION }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Install cosign
        if: ${{ env.PUBLISH == 'true' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image with cosign (keyless)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          IMAGE: ${{ matrix.image.registryurl }}@${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

      - name: Export image reference for SLSA provenance
        id: slsa
        if: ${{ env.PUBLISH == 'true' }}
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          IMAGE_URL: ${{ matrix.image.registryurl }}:${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          echo "image_url_${IMAGE_NAME}=${IMAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "image_digest_${IMAGE_NAME}=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Summarize build
        if: ${{ always() }}
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          IMAGE_URL: ${{ matrix.image.registryurl }}:${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE_NAME}"
            echo "- Reference: \`${IMAGE_URL}\`"
            echo "- Digest: \`${IMAGE_DIGEST:-n/a}\`"
            echo "- Published: ${PUBLISH}"
          } >> "$GITHUB_STEP_SUMMARY"

  slsa-provenance:
    name: SLSA provenance (${{ matrix.image }})
    needs: [build-and-publish]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        image: [github-actions-runner, claude-runner, fileserver]
    permissions:
      actions: read # for detecting the Github Actions environment.
      id-token: write # for creating OIDC tokens for signing.
      packages: write # for uploading attestations.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # must be a tag, SLSA generator rejects SHA refs
    with:
      image: ${{ needs.build-and-publish.outputs[format('image_url_{0}', matrix.image)] }}
      digest: ${{ needs.build-and-publish.outputs[format('image_digest_{0}', matrix.image)] }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
