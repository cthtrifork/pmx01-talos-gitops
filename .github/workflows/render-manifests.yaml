name: Render manifests

on:
  # Manual run on a chosen branch
  workflow_dispatch:
  # Render and commit the result back to the PR branch
  pull_request:
    paths:
      - "k8s/**"
      - "scripts/ci/render-manifests.sh"
      - "Makefile"

# One render per ref; a newer push supersedes the running one
concurrency:
  group: render-manifests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  render-manifests:
    # Fork PRs get a read-only token and cannot be pushed to
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    permissions:
      contents: write
      packages: read

    steps:
      # Push as the Renovate GitHub App instead of GITHUB_TOKEN, so the render
      # commit triggers the e2e and validate workflows.
      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write # push the render commit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request the default ref is the merge commit; check out the branch to push to it
          ref: ${{ github.head_ref || github.ref_name }}
          # Persisted for the push below
          token: ${{ steps.app-token.outputs.token }}

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@22c6ee1a6099ce252b729199c105a38319b587d4 # main

      - name: Render manifests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with: # give up to 3x5 minutes
          timeout_minutes: 5
          max_attempts: 3
          retry_on: timeout
          command: make render-manifests -j $(nproc)
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Stage rendered changes
        run: git add -A

      # Creates the commit through the GitHub API with the app token, so it is
      # signed (Verified) and authored by the Renovate app
      - uses: qoomon/actions--create-commit@7102b1a8b3cb8716dc70dbeb6d774c375d779d2f # v1.2.5
        id: commit
        with:
          message: "chore: render manifests"
          skip-empty: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Push changes
        if: ${{ steps.commit.outputs.commit }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git push origin "HEAD:$BRANCH"
