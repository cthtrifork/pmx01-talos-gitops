name: Render manifests

on:
  # Manual run on a chosen branch
  workflow_dispatch:
    inputs:
      render_all:
        description: "Render all components instead of only the changed ones"
        type: boolean
        default: true
  # Render and commit the result back to the PR branch
  pull_request:
    paths:
      - "k8s/**"
      - "scripts/ci/render-manifests.sh"
      - "Makefile"

# One render per ref; a newer push supersedes the running one
concurrency:
  group: render-manifests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  render-manifests:
    # Fork PRs get a read-only token and cannot be pushed to
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    permissions:
      contents: write
      packages: read

    steps:
      # Push as the Renovate GitHub App instead of GITHUB_TOKEN, so the render
      # commit triggers the e2e and validate workflows.
      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write # push the render commit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request the default ref is the merge commit; check out the branch to push to it
          ref: ${{ github.head_ref || github.ref_name }}
          # Persisted for the push below
          token: ${{ steps.app-token.outputs.token }}

      - name: Get changed files
        id: changed
        if: ${{ github.event_name == 'pull_request' }}
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files: |
            k8s/**
            scripts/ci/render-manifests.sh
            Makefile
          separator: "\n"

      # Map changed files to the component dirs (holding helm-release.yaml) to render.
      # Render everything when not a PR, requested manually, or the render tooling changed.
      - name: Select components to render
        id: select
        env:
          EVENT: ${{ github.event_name }}
          RENDER_ALL: ${{ inputs.render_all }}
          CHANGED: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" && "$RENDER_ALL" != "false" ]] \
            || grep -qxE 'Makefile|scripts/ci/render-manifests.sh' <<<"$CHANGED"; then
            echo "Rendering all components"
            echo "dirs=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          dirs=()
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            d=$(dirname "$f")
            while [[ "$d" != "." && "$d" != "/" ]]; do
              if [[ -f "$d/helm-release.yaml" && -f "$d/helm-repository.yaml" ]]; then
                dirs+=("./$d")
                break
              fi
              d=$(dirname "$d")
            done
          done <<<"$CHANGED"
          selected=$(printf '%s\n' "${dirs[@]}" | sort -u | tr '\n' ' ')
          echo "Components to render: ${selected:-none}"
          echo "dirs=$selected" >>"$GITHUB_OUTPUT"
          echo "none=$([[ -z "${selected// }" ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Flux CLI
        if: ${{ steps.select.outputs.none != 'true' }}
        uses: fluxcd/flux2/action@8e1894f89c61c1b505a72fa50bdadeb1532a8d6b # main
        with:
          token: ${{ github.token }}

      - name: Render manifests
        if: ${{ steps.select.outputs.none != 'true' }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with: # give up to 3x5 minutes
          timeout_minutes: 5
          max_attempts: 3
          retry_on: timeout
          command: make render-manifests RENDER_DIRS="${{ steps.select.outputs.dirs }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Stage rendered changes
        run: git add -A

      # Creates the commit through the GitHub API with the app token, so it is
      # signed (Verified) and authored by the Renovate app
      - uses: qoomon/actions--create-commit@7102b1a8b3cb8716dc70dbeb6d774c375d779d2f # v1.2.5
        id: commit
        with:
          message: "chore: render manifests"
          skip-empty: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Push changes
        if: ${{ steps.commit.outputs.commit }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git push origin "HEAD:$BRANCH"
