name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ '*' ]
    tags-ignore: [ '*' ]

permissions:
    contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      RENOVATE_VERSION: "44.198.3" # renovate: datasource=npm depName=renovate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate renovate config
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict renovate.json5
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@13c7c12b28c21769c7d33e387e677307d38ec22d # main
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@13c7c12b28c21769c7d33e387e677307d38ec22d # main
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@13c7c12b28c21769c7d33e387e677307d38ec22d # main
      - name: Validate manifests -- /apps
        run: ./scripts/validate.sh --dir apps
      - name: Validate manifests -- /infra
        run: ./scripts/validate.sh --dir infra
      - name: Validate manifests -- /clusters
        run: ./scripts/validate.sh --dir clusters
