name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ '*' ]
    tags-ignore: [ '*' ]

permissions:
    contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@fc29ca0375323410da6588eb84a304444943f898 # main
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@46433b84001347af7b914217f84154fe858f9d38 # main
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@46433b84001347af7b914217f84154fe858f9d38 # main
      - name: Validate manifests -- /apps
        run: ./scripts/validate.sh --dir apps
      - name: Validate manifests -- /infra
        run: ./scripts/validate.sh --dir infra
      - name: Validate manifests -- /clusters
        run: ./scripts/validate.sh --dir clusters