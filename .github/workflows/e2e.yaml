name: e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - k8s/**
      - scripts/kind.yaml
      - .github/workflows/e2e.yaml
  push:
    branches: [ main ]
    paths:
      - k8s/**
      - scripts/kind.yaml
      - .github/workflows/e2e.yaml

permissions:
  contents: read

env:
  CILIUM_CLI_VERSION: v0.20.2 # renovate: datasource=github-releases depName=cilium/cilium-cli
  CILIUM_VERSION: v1.20.4 # renovate: datasource=github-releases depName=cilium/cilium
  #INTERACTIVE: false

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true


jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fail fast: build every path Flux syncs before spending time on a cluster
      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@7fb9589778fa8045a1000cb6cfcf9ddd4cd0bf65 # main
      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@7fb9589778fa8045a1000cb6cfcf9ddd4cd0bf65 # main
      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@7fb9589778fa8045a1000cb6cfcf9ddd4cd0bf65 # main
      - name: Build Flux Kustomization paths
        timeout-minutes: 3
        run: ./scripts/ci/build-flux-paths.sh k8s/clusters/homelab
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Setup Flux Operator CLI
        uses: controlplaneio-fluxcd/flux-operator/actions/setup@48e2cd76c475be87a1c9a8bd83fe07e064abd725 # v0.62.1
      - name: Setup Kubernetes Kind
        timeout-minutes: 5
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          config: scripts/kind.yaml
          cluster_name: homelab
      - name: Install cilium CLI
        timeout-minutes: 2
        run: |
          CLI_ARCH=amd64
          if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
          curl -sLo cilium-linux-${CLI_ARCH}.tar.gz https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz
          sudo tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
          rm cilium-linux-${CLI_ARCH}.tar.gz
        env:
          CILIUM_CLI_VERSION: ${{env.CILIUM_CLI_VERSION}}

      - name: Install latest cilium
        run: |
         helm repo add cilium https://helm.cilium.io/

         helm install cilium cilium/cilium --version ${CILIUM_VERSION#v} \
          --namespace kube-system \
          --set hostPort.enabled=true \
          --set nodePort.enabled=true \
          --set ipam.mode=kubernetes \
          --set k8sServicePort=6443 \
          --set encryption.enabled=true \
          --set encryption.type=wireguard \
          --set operator.replicas=1 \
          --set bpf.masquerade=true \
          --set policyAuditMode=true \
          --set securityContext.capabilities.ciliumAgent="{CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}" \
          --set securityContext.capabilities.cleanCiliumState="{NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}" \
          --set cgroup.autoMount.enabled=false \
          --set cgroup.hostRoot=/sys/fs/cgroup
          #--set kubeProxyReplacement=true \
        env:
          CILIUM_VERSION: ${{env.CILIUM_VERSION}}

      - name: Wait for cilium to be ready
        timeout-minutes: 6
        run: |
          interactive="${INTERACTIVE:-true}"
          wait="${WAIT:-5m}"
          cilium status --wait --interactive="${interactive}" --wait-duration="${wait}" # will exit when ready

      - name: Install latest flux-operator
        timeout-minutes: 6
        run: |
          helm install flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator \
          --namespace flux-system \
          --create-namespace \
          --wait

      # The FluxInstance syncs refs/heads/main; point it at the branch under test instead of the already
      # merged state. source-controller cannot fetch the synthetic refs/pull/<n>/merge commit.
      - name: Deploy flux instance
        run: |
          sed "s|ref: \"refs/heads/main\"|ref: \"${SYNC_REF}\"|" k8s/clusters/homelab/flux-instance.yaml |
            tee "${RUNNER_TEMP}/flux-instance.yaml" | grep -F "ref: "
          kubectl apply -f "${RUNNER_TEMP}/flux-instance.yaml"
          # the flux-system Kustomization applies flux-instance.yaml from the ref and would reset the sync ref to main
          kubectl annotate fluxinstance flux -n flux-system kustomize.toolkit.fluxcd.io/reconcile=disabled
        env:
          SYNC_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
      - name: Verify flux instance is ready
        timeout-minutes: 6
        run: |
          kubectl wait --for=condition=Ready fluxinstance flux -n flux-system --timeout=5m

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          token: ${{ github.token }}
          version: 'latest'

      # Kustomizations with spec.decryption fail until the secret exists. Bootstrap has no encrypted
      # files, so a throwaway age key is enough for it.
      - name: Create a throwaway SOPS key
        run: |
          sudo apt-get install -y --no-install-recommends age
          age-keygen -o "${RUNNER_TEMP}/age.agekey"
          kubectl create secret generic sops-age -n flux-system --from-file=age.agekey="${RUNNER_TEMP}/age.agekey"
          rm "${RUNNER_TEMP}/age.agekey"

      - name: Wait for successful reconciliation
        timeout-minutes: 8
        run: |
          wait="${WAIT:-5m}"
          flux reconcile source git flux-system --timeout="${wait}"
          flux reconcile kustomization flux-system --timeout="${wait}"
          kubectl wait --for=condition=Ready kustomization flux-system -n flux-system --timeout=5m
          # fail if Flux deployed anything other than the commit under test
          revision="$(kubectl get gitrepository flux-system -n flux-system -o jsonpath='{.status.artifact.revision}')"
          echo "Flux synced ${revision}, expected ${EXPECTED_SHA}"
          case "${revision}" in *"${EXPECTED_SHA}") ;; *) exit 1 ;; esac
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      # The workloads (app-controllers, app, virtualmachines) are not reconciled here; they are built and
      # schema-checked by the first steps.
      - name: Suspend Kustomizations that are not tested here
        run: |
          for ks in app-controllers app gitops-virtualmachines; do
            flux suspend kustomization "${ks}"
          done
      - name: Wait for the bootstrap Kustomization
        timeout-minutes: 6
        run: |
          flux reconcile kustomization gitops-infra-bootstrap --timeout=5m

      # kind is not the real cluster, so on the live Kustomizations only (never in git):
      # - SOPS: drop decryption and delete the encrypted Secrets (the key is not available)
      # - HelmReleases in gitops-infra: suspend them, they are slow and the cilium release would upgrade the
      #   cilium this job installed. The CRD providers are in gitops-infra-controllers, which runs for real.
      # The manifests of every release are still applied and dry-run against the API server.
      - name: Reconcile infra and infra-post
        timeout-minutes: 15
        run: |
          cat > "${RUNNER_TEMP}/infra.json" <<'EOF'
          {"spec":{"decryption":null,"patches":[
            {"target":{"kind":"Secret","name":"github-auth"},"patch":"$patch: delete\napiVersion: v1\nkind: Secret\nmetadata:\n  name: github-auth\n"},
            {"target":{"kind":"Secret","name":"cloudflare-api-token-secret"},"patch":"$patch: delete\napiVersion: v1\nkind: Secret\nmetadata:\n  name: cloudflare-api-token-secret\n"},
            {"target":{"kind":"HelmRelease"},"patch":"- op: add\n  path: /spec/suspend\n  value: true\n"}]}}
          EOF
          cat > "${RUNNER_TEMP}/post.json" <<'EOF'
          {"spec":{"decryption":null,"patches":[
            {"target":{"kind":"Secret","name":"cloudflare-api-token-secret"},"patch":"$patch: delete\napiVersion: v1\nkind: Secret\nmetadata:\n  name: cloudflare-api-token-secret\n"}]}}
          EOF
          kubectl patch kustomization gitops-infra -n flux-system --type merge --patch-file "${RUNNER_TEMP}/infra.json"
          kubectl patch kustomization gitops-infra-post -n flux-system --type merge --patch-file "${RUNNER_TEMP}/post.json"
          diagnose() {
            kubectl get kustomization "$1" -n flux-system -o jsonpath='{range .status.conditions[*]}{.type}={.status}: {.message}{"\n"}{end}'
            kubectl logs -n flux-system deploy/kustomize-controller --since=15m | grep "\"$1\"" | tail -10 | cut -c1-400
            flux get helmreleases -A || true
            exit 1
          }
          for ks in gitops-infra-controllers gitops-infra gitops-infra-post; do
            flux reconcile kustomization "${ks}" --timeout=8m || diagnose "${ks}"
          done

      - name: List deployed resources
        timeout-minutes: 2
        if: always()
        run: |
          flux tree ks flux-system
          flux get helmreleases -A || true

      - name: Debug failure
        timeout-minutes: 3
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
          kubectl -n flux-system get all
          kubectl -n flux-system logs deploy/source-controller
          kubectl -n flux-system logs deploy/kustomize-controller
          kubectl -n flux-system logs deploy/helm-controller
          flux get all --all-namespaces
