name: Build VEX cache image

# Builds the Trivy VEX cache image (images/vex-cache) that the trivy-operator scan jobs mount read-only.
# Pull request: dry run. Push to main: published when vex/ or the image changed. Manual run: always published.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect VEX changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get changed files
        id: changed
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files: |
            vex/**
            images/vex-cache/**
            .github/workflows/build-vex-cache.yaml

      - name: Decide whether to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" || "$ANY_CHANGED" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: Build and publish (vex-cache)
    needs: [changes]
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for signing with cosign
      packages: write # for pushing and signing the image
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      IMAGE: ghcr.io/${{ github.repository }}/vex-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute build tag
        id: prep
        run: echo "BUILD_TAG=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # no layer cache: the download layer must run on every build
      - name: Build image${{ env.PUBLISH == 'true' && ' and push to GHCR' || ' (no push on pull requests)' }}
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./images/vex-cache/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.prep.outputs.BUILD_TAG }}
          no-cache: true
          sbom: false
          provenance: false # keep a plain image manifest: it is mounted as a volume, not run

      - name: Install cosign
        if: ${{ env.PUBLISH == 'true' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image with cosign (keyless)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summarize build
        if: ${{ always() }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          BUILD_TAG: ${{ steps.prep.outputs.BUILD_TAG }}
        run: |
          {
            echo "### vex-cache"
            echo "- Reference: \`${IMAGE}:latest\`, \`${IMAGE}:${BUILD_TAG}\`"
            echo "- Digest: \`${DIGEST:-n/a}\`"
            echo "- Published: ${PUBLISH}"
          } >> "$GITHUB_STEP_SUMMARY"
