name: Build VEX cache image

# images/vex-cache holds the Trivy VEX repositories (the Trivy VEX hub and vex/) as a ready-made cache. The trivy-operator
# scan jobs mount it as a read-only image volume. It is rebuilt every 6 hours (the cached manifests stay valid for 7 days),
# and on every change of vex/. The scan jobs use the floating tag latest; every build also gets an immutable UTC timestamp
# tag (for example 20261109-1523) to tell builds apart and to pin the volume to a known-good one. Pull request: built, not pushed.

on:
  pull_request:
    branches:
      - main
    paths:
      - images/vex-cache/**
      - vex/**
      - .github/workflows/build-vex-cache.yaml
  push:
    branches:
      - main
    paths:
      - images/vex-cache/**
      - vex/**
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish (vex-cache)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for signing with cosign
      packages: write # for pushing and signing the image
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      IMAGE: ghcr.io/${{ github.repository }}/vex-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute build tag
        id: prep
        run: echo "BUILD_TAG=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No layer cache on purpose: the layer that downloads the VEX data must run again on every build.
      - name: Build image${{ env.PUBLISH == 'true' && ' and push to GHCR' || ' (no push on pull requests)' }}
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./images/vex-cache/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.prep.outputs.BUILD_TAG }}
          no-cache: true
          sbom: false
          provenance: false # keep a plain image manifest: it is mounted as a volume, not run

      - name: Install cosign
        if: ${{ env.PUBLISH == 'true' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image with cosign (keyless)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summarize build
        if: ${{ always() }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          BUILD_TAG: ${{ steps.prep.outputs.BUILD_TAG }}
        run: |
          {
            echo "### vex-cache"
            echo "- Reference: \`${IMAGE}:latest\`, \`${IMAGE}:${BUILD_TAG}\`"
            echo "- Digest: \`${DIGEST:-n/a}\`"
            echo "- Published: ${PUBLISH}"
          } >> "$GITHUB_STEP_SUMMARY"
