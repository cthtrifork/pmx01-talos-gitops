---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set-controller
  namespace: arc-controller-system
spec:
  interval: 30m
  releaseName: gha-runner-scale-set-controller
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-controller
  install:
    createNamespace: true
  # https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set-controller/values.yaml
  values:
    image:
      # renovate: datasource=docker depName=ghcr.io/actions/gha-runner-scale-set-controller versioning=docker
      tag: 0.15.1@sha256:4b51a20db717b194e2f3fa96cfe2ddcb21602811f79053c75fd1a383517b9f90
    serviceAccount:
      create: true
    watchSingleNamespace: arc-runners-system
    flags:
      updateStrategy: "eventual"
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi

    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000

    podSecurityContext:
      fsGroup: 2000
