# Default deny both ways for the namespace, then what the ARC controller and the scale-set listener need: DNS, the
# Kubernetes API (they work through the EphemeralRunnerSet resources) and HTTPS to GitHub. Nothing connects to them.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-controller-system-default-deny
  namespace: arc-controller-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-controller-system-allow-egress
  namespace: arc-controller-system
spec:
  endpointSelector: {}
  egress:
    # DNS through kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API
    - toEntities:
        - kube-apiserver
    # GitHub (the Actions service, its broker and the API), by DNS name: anything not listed is dropped
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchPattern: "*.actions.githubusercontent.com"
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
