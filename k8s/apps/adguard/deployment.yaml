---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-deployment
  namespace: adguard-system
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  #strategy: # always have atleast 1 available pod during updates
  #  type: RollingUpdate
  #  rollingUpdate:
  #    maxSurge: 1
  #    maxUnavailable: 0
  selector:
    matchLabels:
      app: adguard-home
  template:
    metadata:
      labels:
        app: adguard-home
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        # Tolerate the control plane taint
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - adguard-home
                topologyKey: "kubernetes.io/hostname" # Ensure 1 pod per node

      initContainers:
        - name: copy-config
          image: mirror.gcr.io/library/busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              cp -vf /tmp/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml
          volumeMounts:
            - name: adguard-config
              mountPath: /opt/adguardhome/conf
            - name: initial-config
              mountPath: /tmp/AdGuardHome.yaml
              subPath: AdGuardHome.yaml
          securityContext:
            capabilities:
              drop:
                - "ALL"
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            runAsUser: 65534
            runAsGroup: 65534
      containers:
        - name: adguard-home
          image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
          ports:
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 3000
              name: http
              protocol: TCP
            - containerPort: 443
              name: https
              protocol: TCP
            - containerPort: 853
              name: dns-tls
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: adguard-data
              mountPath: /opt/adguardhome/work/ # AdGuard Runtime data
            - name: adguard-config
              mountPath: /opt/adguardhome/conf/ # AdGuard configuration
            - name: adguard-tls-cert
              mountPath: /opt/adguardhome/conf/tls/ # TLS certs
          # The image's AdGuardHome binary has the file capability cap_net_bind_service=+eip (setcap in its Dockerfile),
          # which is how it binds ports 53, 443 and 853 as non-root. For that to work the capability must be in the
          # container's bounding set (hence drop ALL, add NET_BIND_SERVICE) and no_new_privs must be off, i.e.
          # allowPrivilegeEscalation must stay true. With every capability dropped, or with allowPrivilegeEscalation: false,
          # the kernel refuses to exec the binary ("operation not permitted").
          securityContext:
            allowPrivilegeEscalation: true
            privileged: false
            # writes only to the conf and work volumes (and /tmp)
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
              add:
                - NET_BIND_SERVICE
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: initial-config
          configMap:
            name: adguard-initial-config
        - name: adguard-tls-cert
          secret:
            secretName: adguard-tls-cert
        - name: adguard-data
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: local-path
                resources:
                  requests:
                    storage: 10Gi
        - name: adguard-config
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: local-path
                resources:
                  requests:
                    storage: 1Gi
