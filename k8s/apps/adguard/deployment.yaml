---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-deployment
  namespace: adguard-system
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  #strategy: # always have atleast 1 available pod during updates
  #  type: RollingUpdate
  #  rollingUpdate:
  #    maxSurge: 1
  #    maxUnavailable: 0
  selector:
    matchLabels:
      app: adguard-home
  template:
    metadata:
      labels:
        app: adguard-home
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
        # 53, 443 and 853 are privileged ports. The binary's file capability cannot be used (see the copy-binary init
        # container), so lower the start of the unprivileged range instead (a safe sysctl).
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      tolerations:
        # Tolerate the control plane taint
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - adguard-home
                topologyKey: "kubernetes.io/hostname" # Ensure 1 pod per node

      initContainers:
        - name: copy-config
          image: mirror.gcr.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              cp -vf /tmp/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml
          volumeMounts:
            - name: adguard-config
              mountPath: /opt/adguardhome/conf
            - name: initial-config
              mountPath: /tmp/AdGuardHome.yaml
              subPath: AdGuardHome.yaml
          securityContext:
            capabilities:
              drop:
                - "ALL"
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            privileged: false
            runAsUser: 65534
            runAsGroup: 65534
        # The AdGuardHome binary in the image has the file capability cap_net_bind_service=+eip (setcap in its Dockerfile).
        # Under no_new_privs / dropped capabilities the kernel refuses to exec it ("operation not permitted", see #590).
        # cp does not copy that extended attribute, so the copy runs as a plain non-root binary.
        - name: copy-binary
          image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              cp -v /opt/adguardhome/AdGuardHome /adguard-bin/AdGuardHome
          volumeMounts:
            - name: adguard-bin
              mountPath: /adguard-bin
          securityContext:
            capabilities:
              drop:
                - "ALL"
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            privileged: false
      containers:
        - name: adguard-home
          image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
          # the image's entrypoint and arguments, with the binary swapped for the copy
          command:
            - /adguard-bin/AdGuardHome
          args:
            - --no-check-update
            - -c
            - /opt/adguardhome/conf/AdGuardHome.yaml
            - -w
            - /opt/adguardhome/work
          ports:
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 3000
              name: http
              protocol: TCP
            - containerPort: 443
              name: https
              protocol: TCP
            - containerPort: 853
              name: dns-tls
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: adguard-bin
              mountPath: /adguard-bin
              readOnly: true
            - name: adguard-data
              mountPath: /opt/adguardhome/work/ # AdGuard Runtime data
            - name: adguard-config
              mountPath: /opt/adguardhome/conf/ # AdGuard configuration
            - name: adguard-tls-cert
              mountPath: /opt/adguardhome/conf/tls/ # TLS certs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: adguard-bin
          emptyDir: {}
        - name: initial-config
          configMap:
            name: adguard-initial-config
        - name: adguard-tls-cert
          secret:
            secretName: adguard-tls-cert
        - name: adguard-data
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: local-path
                resources:
                  requests:
                    storage: 10Gi
        - name: adguard-config
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: local-path
                resources:
                  requests:
                    storage: 1Gi
