# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/statefulset-apps-v1.json
# Claude Code Remote Control, signed in as a person. Alternative to the self-hosted runner (deployment.yaml)
# for when nobody can reach admin settings to create an environment key. It reuses the `claude`
# ServiceAccount (read-only RBAC), the egress allowlist and the optional GitHub token.
#
# The login lives on the PVC mounted at /home/claude (~/.claude/.credentials.json, ~/.claude.json), so it
# survives restarts and the token refreshes in place. No Secret is written back, no extra RBAC.
# The pod idles until a login exists, then starts `claude remote-control`. One-time login: README.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claude-rc
  namespace: claude-system
spec:
  replicas: 1
  serviceName: claude-rc
  selector:
    matchLabels:
      app: claude-rc
  template:
    metadata:
      labels:
        app: claude-rc
    spec:
      serviceAccountName: claude
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claude
          image: ghcr.io/cthtrifork/pmx01-talos-gitops/claude-runner:rc-REPLACE # TODO same tag as deployment.yaml, pin by digest
          command: ["/bin/bash", "-c"]
          args:
            - |
              until [ -s "$HOME/.claude/.credentials.json" ]; do
                echo "not logged in: kubectl -n claude-system exec -it claude-rc-0 -- claude"
                sleep 30
              done
              exec claude remote-control --name pmx01-talos
          env:
            - name: DISABLE_AUTOUPDATER
              value: "1" # the binary is baked into the image
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/claude
            - name: github-token
              mountPath: /etc/github
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: github-token
          secret:
            secretName: claude-github-token
            optional: true # created by hand, see README.md
            defaultMode: 0400
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
