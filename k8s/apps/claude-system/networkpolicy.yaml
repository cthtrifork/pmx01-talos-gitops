# Default deny both ways for everything in the namespace, then an egress whitelist by DNS name.
# Edit the toFQDNs list if Claude Code or git needs another host; anything not listed is dropped.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-default-deny
  namespace: claude-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-egress-allowlist
  namespace: claude-system
spec:
  endpointSelector: {}
  egress:
    # DNS through kube-dns; the dns rule makes Cilium learn the addresses the FQDN rules below match
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API (read-only through the ServiceAccount's RBAC)
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        # Anthropic: API and Remote Control
        - matchName: api.anthropic.com
        - matchName: claude.ai
        # GitHub: git over HTTPS, the API and release/raw downloads
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
