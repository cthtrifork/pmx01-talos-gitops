# Default deny both ways for everything in the namespace, then an egress whitelist by DNS name.
# Edit the toFQDNs list if the runner needs another host; anything not listed is dropped. The cloud
# metadata address 169.254.169.254 is not allowed, as the Anthropic docs require.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-default-deny
  namespace: claude-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-egress-allowlist
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-rc
  egress:
    # DNS through kube-dns; the dns rule makes Cilium learn the addresses the FQDN rules below match
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API (read-only through the ServiceAccount's RBAC)
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        # The runner's required hosts (https://code.claude.com/docs/en/self-hosted-environments-deploy,
        # "Network requirements"): control plane and inference, then git.
        # Claude Code / Remote Control
        - matchName: api.anthropic.com
        - matchName: anthropic.com

        # Source hosting and MCP
        - matchName: github.com
        - matchPattern: "*.github.com"
        - matchName: githubassets.com
        - matchName: githubcopilot.com

        # Context and documentation
        - matchName: cilium.io
        - matchPattern: "*.cilium.io"
        - matchPattern: "*.githubusercontent.com"
        - matchName: "context7.com"

        # Integrations
        - matchPattern: "*.portableinfo.cloud"

        # Claude Code itself: plugin installs and metadata, documentation lookups
        - matchName: downloads.claude.ai
        - matchName: storage.googleapis.com
        - matchName: code.claude.com
        - matchName: claude.com
        # Sign-in (OAuth) and Remote Control
        - matchName: claude.ai
        - matchName: platform.claude.com
        - matchPattern: "*.claudeusercontent.com"
        # Only needed when sessions install plugins or run npx MCP servers
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
---
# The token refresher only needs DNS, the Kubernetes API (to write one Secret) and api.github.com.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-token-refresher-egress
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-token-refresher
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
