# Default deny both ways for everything in the namespace, then an egress whitelist by DNS name.
# Edit the toFQDNs list if the runner needs another host; anything not listed is dropped. The cloud
# metadata address 169.254.169.254 is not allowed, as the Anthropic docs require.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-default-deny
  namespace: claude-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-egress-allowlist
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-rc
  egress:
    # DNS through kube-dns; the dns rule makes Cilium learn the addresses the FQDN rules below match
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    # Prometheus (read-only queries for disk and resource usage)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }
    # Polaris dashboard (read-only fetch of /results.json); the service's port 80 maps to 8080 on the pod
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: policy-system
            k8s:app: polaris
            k8s:component: dashboard
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
    # Redpanda Connect hook (a read-only GET of /metrics to check it); the service's port 80 maps to 4195 on the pod
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - security-system
            - key: k8s:app.kubernetes.io/instance
              operator: In
              values:
                - sbom-hook
      toPorts:
        - ports:
            - { port: "4195", protocol: TCP }
    # Usage API (the page and /api/v1)
    - toEndpoints:
        - matchLabels:
            k8s:app: claude-usage
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
    # Kubernetes API (read-only through the ServiceAccount's RBAC)
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        # The runner's required hosts (https://code.claude.com/docs/en/self-hosted-environments-deploy,
        # "Network requirements"): control plane and inference, then git.
        # Claude Code / Remote Control
        - matchName: api.anthropic.com
        - matchName: anthropic.com

        # Source hosting and MCP
        - matchName: github.com
        - matchPattern: "*.github.com"
        - matchName: githubassets.com
        - matchName: githubcopilot.com

        # Context and documentation
        - matchName: cilium.io
        - matchPattern: "*.cilium.io"
        - matchPattern: "*.githubusercontent.com"
        # GitHub Pages sites (docs, JSON schema catalogs)
        - matchPattern: "*.github.io"
        # Actions job logs (gh run view --log): the receiver and the results blob storage the logs redirect to
        - matchPattern: "*.actions.githubusercontent.com"
        - matchPattern: "*.blob.core.windows.net"
        - matchName: "context7.com"

        # Container registries (read-only inspection of images and layers with crane/skopeo). The blob
        # redirects of ghcr.io go to pkg-containers.githubusercontent.com, covered by *.githubusercontent.com
        - matchName: ghcr.io
        - matchName: quay.io
        - matchPattern: "*.quay.io"
        # index.docker.io is the registry host crane uses for docker.io images; it answers with registry-1.docker.io
        - matchName: index.docker.io
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: gcr.io
        - matchName: mirror.gcr.io

        # Bandwidth tests with curl (download __down, upload __up)
        - matchName: speed.cloudflare.com

        # Integrations
        - matchPattern: "*.portableinfo.cloud"

        # Claude Code itself: plugin installs and metadata, documentation lookups
        - matchName: downloads.claude.ai
        - matchName: storage.googleapis.com
        - matchName: code.claude.com
        - matchName: claude.com
        # Sign-in (OAuth) and Remote Control
        - matchName: claude.ai
        - matchName: platform.claude.com
        - matchPattern: "*.claudeusercontent.com"
        # Only needed when sessions install plugins or run npx MCP servers
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
---
# The token refresher only needs DNS, the Kubernetes API (to write one Secret) and api.github.com.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-token-refresher-egress
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-token-refresher
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
---
# The Omni service exposer runs on the host network: it arrives as host or remote-node.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-usage
  namespace: claude-system
spec:
  endpointSelector:
    matchLabels:
      app: claude-usage
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            k8s:app: claude-rc
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }
