---
# "Update the Claude VM" button (see vm-upgrade/redpanda-connect.yaml and the README). The pod only holds a flag; the VM polls it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-vm-upgrade
  namespace: claude-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-vm-upgrade
  template:
    metadata:
      labels:
        app: claude-vm-upgrade
        prometheus-scrape: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect
          image: mirror.gcr.io/redpandadata/connect:4.117.0@sha256:b6df7ca0c506578c8cc8b0cd223c117366bbeac84365f95944d339f0165b551c # renovate: datasource=docker depName=docker.io/redpandadata/connect versioning=docker
          args:
            - -c
            - /etc/connect/redpanda-connect.yaml
            - --disable-telemetry
          ports:
            - { name: http, containerPort: 8080 }
            - { name: poll, containerPort: 8081 }
            - { name: metrics, containerPort: 4195 }
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/connect
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: claude-vm-upgrade-connect-config
---
# The page and the button, through the Omni service exposer (Omni login).
apiVersion: v1
kind: Service
metadata:
  name: claude-vm-upgrade
  namespace: claude-system
  annotations:
    omni-kube-service-exposer.sidero.dev/label: "Update Claude VM"
    omni-kube-service-exposer.sidero.dev/port: "50092"
    omni-kube-service-exposer.sidero.dev/prefix: claudevmupgrade
spec:
  type: ClusterIP
  selector:
    app: claude-vm-upgrade
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 4195
      targetPort: metrics
---
# The VM's poll (POST /api/v1/claim), plain HTTP on the LAN. Not exposed through Omni: this listener cannot queue an upgrade.
# Only the VM's address (192.168.1.132) is let in, by the CiliumNetworkPolicy. externalTrafficPolicy Local keeps the client address:
# with Cluster, traffic that lands on another node is source-NATed to that node and the policy would see the node, not the VM.
# 192.168.1.244 is free in the MetalLB pool (192.168.1.221-254); the VM's /etc/claude-vm/upgrade/url points at it.
apiVersion: v1
kind: Service
metadata:
  name: claude-vm-upgrade-lb
  namespace: claude-system
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.244
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: claude-vm-upgrade
  ports:
    - name: poll
      port: 80
      targetPort: poll
      protocol: TCP
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: claude-vm-upgrade
  namespace: claude-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: claude-vm-upgrade
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
