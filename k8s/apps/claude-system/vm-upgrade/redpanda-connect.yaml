---
# "Update the Claude VM" button. One in-memory flag, two listeners:
#
#   :8080  ui    the page and the button       Omni service exposer (Omni login)
#   :8081  poll  the VM asks "upgrade now?"    MetalLB, LAN only, the NetworkPolicy lets in the VM's IP only
#
# ui   GET  /                  the page
#      GET  /api/v1/status     is a click queued, when did the VM last poll
#      POST /api/v1/upgrade    queue a click (needs the header X-Requested-With: vm-upgrade-button)
# poll POST /api/v1/report     the VM says what it runs (booted and staged ostree deployment); also counts as a poll
#      POST /api/v1/claim      {"upgrade": true} once per click, then false
#
# The VM never receives a command, only true or false. A click lives 10 minutes and the first claim clears it, so one click
# is at most one upgrade. A pod restart drops an unclaimed click.
# Not a Flux template (configMapGenerator disables postBuild envsubst).
http:
  enabled: true
  address: 0.0.0.0:4195
  debug_endpoints: false

# --- state: "pending" (a click) and "last_poll" hold {"at": <unix seconds>}; "vm" holds what the VM last reported ---
cache_resources:
  - label: state
    memory:
      default_ttl: 10m
      compaction_interval: 1m

# --- inputs: the same reply format on both; the listener name is stored in metadata ---
input:
  broker:
    inputs:
      - label: ui
        http_server:
          address: 0.0.0.0:8080
          path: /
          allowed_verbs:
            - GET
            - POST
          sync_response: &reply
            status: '${! @status.or("200") }'
            headers:
              Content-Type: '${! @content_type.or("application/json") }'
              Cache-Control: no-store
        processors:
          - mapping: 'meta listener = "ui"'

      - label: poll
        http_server:
          address: 0.0.0.0:8081
          path: /
          allowed_verbs:
            - GET
            - POST
          sync_response: *reply
        processors:
          - mapping: 'meta listener = "poll"'

pipeline:
  processors:
    - switch:
        - check: '@listener == "ui"'
          processors:
            - resource: ui_api
        - check: '@listener == "poll"'
          processors:
            - resource: poll_api

output:
  sync_response: {}

processor_resources:
  # ------------------------------------------------------------------------------------------------
  # Flag helpers. Each takes the key in the metadata field `flag` and leaves the message body alone.
  # ------------------------------------------------------------------------------------------------

  # Reads the flag into the metadata field `flag_at`: unix seconds of the last set, or 0 when it is not set (or has expired).
  - label: read_flag
    branch:
      request_map: 'root = ""'
      processors:
        - cache: { resource: state, operator: get, key: '${! @flag }' }
        - catch:
            - mapping: 'root = {"at": 0}'
      result_map: 'meta flag_at = this.at'

  # Sets the flag to now. The metadata field `flag_ttl` says how long it lives.
  - label: set_flag
    branch:
      request_map: 'root = ""'
      processors:
        - cache:
            resource: state
            operator: set
            key: '${! @flag }'
            value: '{"at": ${! now().ts_unix() }}'
            ttl: '${! @flag_ttl }'

  # Reads what the VM last reported into the metadata field `vm` ({} when nothing, or nothing recent).
  - label: read_vm
    branch:
      request_map: 'root = ""'
      processors:
        - cache: { resource: state, operator: get, key: vm }
        - catch:
            - mapping: 'root = {}'
      result_map: 'meta vm = this'

  # Clears the flag; clearing one that is not set is fine.
  - label: clear_flag
    branch:
      request_map: 'root = ""'
      processors:
        - cache: { resource: state, operator: delete, key: '${! @flag }' }
        - catch:
            - mapping: 'root = ""'

  # ------------------------------------------------------------------------------------------------
  # Replies
  # ------------------------------------------------------------------------------------------------
  - label: not_found
    mapping: |
      meta status = "404"
      root = {"error": "not found"}

  # ------------------------------------------------------------------------------------------------
  # The page listener
  # ------------------------------------------------------------------------------------------------
  - label: ui_api
    switch:
      - check: '@http_server_verb == "GET" && (@http_server_request_path == "/" || @http_server_request_path == "/index.html")'
        processors:
          - mapping: |
              meta content_type = "text/html; charset=utf-8"
              root = file("/etc/connect/index.html")

      - check: '@http_server_request_path == "/healthz"'
        processors:
          - mapping: |
              meta content_type = "text/plain"
              root = "ok"

      - check: '@http_server_verb == "GET" && @http_server_request_path == "/api/v1/status"'
        processors:
          - mapping: 'meta flag = "pending"'
          - resource: read_flag
          - mapping: 'meta pending_at = @flag_at'
          - mapping: 'meta flag = "last_poll"'
          - resource: read_flag
          - resource: read_vm
          - mapping: |
              root.pending = @pending_at > 0
              root.pending_at = @pending_at
              root.last_poll_at = @flag_at
              root.vm = @vm
              root.now = now().ts_unix()

      # A form on another site cannot add a custom header without a CORS preflight, which this server never answers.
      - check: '@http_server_verb == "POST" && @http_server_request_path == "/api/v1/upgrade" && metadata("X-Requested-With").or("") != "vm-upgrade-button"'
        processors:
          - mapping: |
              meta status = "403"
              root = {"error": "missing X-Requested-With header"}

      - check: '@http_server_verb == "POST" && @http_server_request_path == "/api/v1/upgrade"'
        processors:
          - mapping: |
              meta flag = "pending"
              meta flag_ttl = "10m"
          - resource: set_flag
          - mapping: 'root = {"queued": true}'

      - processors:
          - resource: not_found

  # ------------------------------------------------------------------------------------------------
  # The VM's listener. There is no authentication here: the CiliumNetworkPolicy lets only the VM's address reach :8081.
  # ------------------------------------------------------------------------------------------------
  - label: poll_api
    switch:
      - check: '@http_server_request_path == "/healthz"'
        processors:
          - mapping: |
              meta content_type = "text/plain"
              root = "ok"

      - check: '@http_server_verb == "POST" && @http_server_request_path == "/api/v1/claim"'
        processors:
          - mapping: 'meta flag = "pending"'
          - resource: read_flag
          - mapping: 'meta upgrade = @flag_at > 0'
          - resource: clear_flag
          - mapping: 'root = {"upgrade": @upgrade}'

      # The body is whatever the VM sends: keep three known fields, only plain characters, short. The page shows them as text.
      - check: '@http_server_verb == "POST" && @http_server_request_path == "/api/v1/report"'
        processors:
          - mapping: |
              map clean {
                root = this.string().catch("").re_replace_all("[^A-Za-z0-9._:/@+-]", "").slice(0, 64).catch("")
              }
              let b = content().parse_json().catch({})
              meta vm = {
                "booted_version": $b.booted_version.or("").apply("clean"),
                "booted_digest": $b.booted_digest.or("").apply("clean"),
                "staged_version": $b.staged_version.or("").apply("clean")
              }
          - branch:
              request_map: 'root = @vm'
              processors:
                - cache:
                    resource: state
                    operator: set
                    key: vm
                    value: '${! content() }'
                    ttl: 24h
          - mapping: |
              meta flag = "last_poll"
              meta flag_ttl = "24h"
          - resource: set_flag
          - mapping: 'root = {"ok": true}'

      - processors:
          - resource: not_found
