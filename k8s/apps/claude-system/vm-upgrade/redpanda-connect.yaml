---
# "Update the Claude VM" button. Two listeners share one in-memory flag:
#   :8080  the page and the button (exposed through the Omni service exposer, behind Omni login)
#   :8081  the VM's poll (MetalLB address, LAN only, needs the bearer token)
# The VM never receives a command: the answer to its poll is only {"upgrade": true|false}. The flag lives 10 minutes
# and is cleared when the VM claims it, so one click means at most one upgrade. A restart of the pod drops an unclaimed click.
# Not a Flux template (configMapGenerator disables postBuild envsubst); env() reads the token from the pod's environment.
http:
  enabled: true
  address: 0.0.0.0:4195
  debug_endpoints: false

cache_resources:
  - label: state
    memory:
      default_ttl: 10m
      compaction_interval: 1m

input:
  broker:
    inputs:
      - http_server:
          address: 0.0.0.0:8080
          path: /
          allowed_verbs:
            - GET
            - POST
          sync_response:
            status: '${! @status.or("200") }'
            headers:
              Content-Type: '${! @content_type.or("application/json") }'
              Cache-Control: no-store
        processors:
          - mapping: 'meta listener = "ui"'
      - http_server:
          address: 0.0.0.0:8081
          path: /
          allowed_verbs:
            - GET
            - POST
          sync_response:
            status: '${! @status.or("200") }'
            headers:
              Content-Type: '${! @content_type.or("application/json") }'
              Cache-Control: no-store
        processors:
          - mapping: 'meta listener = "poll"'

pipeline:
  processors:
    - switch:
        # --- poll listener: authenticated, one endpoint ---
        - check: '@listener == "poll" && @http_server_request_path == "/healthz"'
          processors:
            - mapping: |
                meta content_type = "text/plain"
                root = "ok"

        - check: '@listener == "poll" && (env("UPGRADE_TOKEN").or("") == "" || @Authorization.or("") != "Bearer " + env("UPGRADE_TOKEN").or(""))'
          processors:
            - mapping: |
                meta status = "401"
                root = {"error": "unauthorized"}

        - check: '@listener == "poll" && @http_server_verb == "POST" && @http_server_request_path == "/api/v1/claim"'
          processors:
            - mapping: 'root = {}'
            - branch:
                request_map: 'root = ""'
                processors:
                  - cache: { resource: state, operator: get, key: pending }
                  - catch:
                      - mapping: 'root = {"at": 0}'
                result_map: 'root.pending_at = this.at'
            # claim: clear the flag, and record that the VM polled
            - branch:
                request_map: 'root = ""'
                processors:
                  - cache: { resource: state, operator: delete, key: pending }
                  - catch:
                      - mapping: 'root = ""'
            - branch:
                request_map: 'root = ""'
                processors:
                  - cache:
                      resource: state
                      operator: set
                      key: last_poll
                      value: '{"at": ${! now().ts_unix() }}'
                      ttl: 24h
                  - catch:
                      - mapping: 'root = ""'
            - mapping: 'root = {"upgrade": this.pending_at > 0}'

        - check: '@listener == "poll"'
          processors:
            - mapping: |
                meta status = "404"
                root = {"error": "not found"}

        # --- ui listener: the page, the status and the button ---
        - check: '@listener == "ui" && @http_server_verb == "GET" && (@http_server_request_path == "/" || @http_server_request_path == "/index.html")'
          processors:
            - mapping: |
                meta content_type = "text/html; charset=utf-8"
                root = file("/etc/connect/index.html")

        - check: '@listener == "ui" && @http_server_request_path == "/healthz"'
          processors:
            - mapping: |
                meta content_type = "text/plain"
                root = "ok"

        - check: '@listener == "ui" && @http_server_verb == "GET" && @http_server_request_path == "/api/v1/status"'
          processors:
            - mapping: 'root = {}'
            - branch:
                request_map: 'root = ""'
                processors:
                  - cache: { resource: state, operator: get, key: pending }
                  - catch:
                      - mapping: 'root = {"at": 0}'
                result_map: 'root.pending_at = this.at'
            - branch:
                request_map: 'root = ""'
                processors:
                  - cache: { resource: state, operator: get, key: last_poll }
                  - catch:
                      - mapping: 'root = {"at": 0}'
                result_map: 'root.last_poll_at = this.at'
            - mapping: |
                root.pending = this.pending_at > 0
                root.pending_at = this.pending_at
                root.last_poll_at = this.last_poll_at
                root.now = now().ts_unix()

        # A POST from another site cannot set a custom header without a CORS preflight, which this server never answers.
        - check: '@listener == "ui" && @http_server_verb == "POST" && @http_server_request_path == "/api/v1/upgrade" && metadata("X-Requested-With").or("") != "vm-upgrade-button"'
          processors:
            - mapping: |
                meta status = "403"
                root = {"error": "missing X-Requested-With header"}

        - check: '@listener == "ui" && @http_server_verb == "POST" && @http_server_request_path == "/api/v1/upgrade"'
          processors:
            - cache:
                resource: state
                operator: set
                key: pending
                value: '{"at": ${! now().ts_unix() }}'
                ttl: 10m
            - mapping: 'root = {"queued": true}'

        - processors:
            - mapping: |
                meta status = "404"
                root = {"error": "not found"}

output:
  sync_response: {}
