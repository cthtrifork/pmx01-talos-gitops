<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update VMs</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f4f4f1; --card: #ffffff; --ink: #141413; --ink-2: #55534e; --line: #e3e2da;
    --accent: #2a78d6; --on-accent: #ffffff; --ok: #1a7f4b; --warn: #b4690e; --bad: #c0392b;
    --warn-bg: #fff4d6; --danger: #c0392b;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --card: #1a1a19; --ink: #f0efec; --ink-2: #b4b2a9; --line: #2c2c2a;
      --accent: #3987e5; --ok: #3cc58a; --warn: #e0a040; --bad: #ef6a5b; --warn-bg: #3a2f10; --danger: #ef6a5b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 var(--font);
         padding: 24px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: flex; justify-content: center; }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .sub { margin: 0 0 16px; color: var(--ink-2); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .health { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-2); flex: none; }
  .health.ok .dot { background: var(--ok); }
  .health.stale .dot { background: var(--bad); }
  .health small { font-weight: 400; color: var(--ink-2); margin-left: auto; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }
  dt { color: var(--ink-2); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .mono { font-family: var(--mono); font-size: 13px; }
  .note { display: block; font-size: 12px; color: var(--warn); }
  .actions { margin-top: 16px; }
  button { font: inherit; font-weight: 600; width: 100%; min-height: 48px; padding: 12px 20px; border: 0; border-radius: 10px;
           background: var(--accent); color: var(--on-accent); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  button.danger { background: var(--danger); }
  .link { background: none; color: var(--ink-2); font-weight: 400; min-height: 40px; margin-top: 4px; text-decoration: underline; }
  .confirm { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); font-size: 14px; }
  .hint { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); min-height: 1.5em; }
  .hint.warn { color: var(--warn); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Update VMs</h1>
  <p class="sub">Runs <code>bootc upgrade --apply</code> on a VM. A VM that finds no new image does not reboot.</p>
  <div id="cards"></div>
  <p id="error" class="hint warn" role="status"></p>
</main>

<template id="card">
  <section class="card">
    <h2></h2>
    <div class="health"><span class="dot" aria-hidden="true"></span><span class="health-text">Checking…</span><small class="health-ago"></small></div>
    <dl>
      <dt>Running</dt><dd class="booted">…</dd>
      <dt>Staged</dt><dd class="staged">…</dd>
    </dl>
    <div class="actions">
      <p class="confirm" hidden></p>
      <button type="button" class="go" disabled>Update now</button>
      <button type="button" class="link cancel" hidden>Cancel</button>
      <p class="hint" role="status" aria-live="polite"></p>
    </div>
  </section>
</template>

<script>
(function () {
  var STALE_AFTER = 150;   // seconds without a poll before a VM counts as not responding (the timers run every 60 s)
  var LABELS = { 'claude-vm': 'Claude VM', 'homeserver': 'Home server' };
  var cards = {};          // vm name -> { el, pending, online, confirming }

  function ago(t, now) {
    if (!t) return 'never';
    var s = Math.max(0, now - t);
    return s < 90 ? s + ' s ago' : Math.round(s / 60) + ' min ago';
  }

  function card(name) {
    if (cards[name]) return cards[name];
    var el = document.getElementById('card').content.firstElementChild.cloneNode(true);
    el.querySelector('h2').textContent = LABELS[name] || name;
    var c = { name: name, el: el, pending: false, online: false, confirming: false,
              go: el.querySelector('.go'), cancel: el.querySelector('.cancel'), confirmBox: el.querySelector('.confirm'), hint: el.querySelector('.hint') };
    c.confirmBox.textContent = (LABELS[name] || name) + ' reboots if a new image exists, and anything running on it ends.';
    c.go.addEventListener('click', function () {
      if (!c.confirming) { c.confirming = true; c.hint.textContent = ''; render(c); return; }
      c.go.disabled = true;
      fetch('api/v1/vms/' + encodeURIComponent(name) + '/upgrade', { method: 'POST', headers: { 'X-Requested-With': 'vm-upgrade-button' } })
        .then(function (r) {
          c.confirming = false;
          c.hint.className = r.ok ? 'hint' : 'hint warn';
          c.hint.textContent = r.ok ? 'Queued.' : 'Failed (' + r.status + ').';
          refresh();
        })
        .catch(function () { c.confirming = false; c.hint.className = 'hint warn'; c.hint.textContent = 'Failed: could not reach the page.'; render(c); });
    });
    c.cancel.addEventListener('click', function () { c.confirming = false; render(c); });
    document.getElementById('cards').appendChild(el);
    cards[name] = c;
    return c;
  }

  function render(c) {
    c.cancel.hidden = !c.confirming;
    c.confirmBox.hidden = !c.confirming;
    c.go.classList.toggle('danger', c.confirming);
    if (c.pending) {
      c.go.disabled = true; c.go.textContent = 'Queued, waiting for the VM';
      c.hint.className = 'hint'; c.hint.textContent = 'The VM checks every minute; the request expires after 10 minutes.';
      return;
    }
    c.go.disabled = false; c.go.textContent = c.confirming ? 'Confirm update' : 'Update now';
    if (c.confirming) return;
    if (!c.online) { c.hint.className = 'hint warn'; c.hint.textContent = 'The VM has not polled recently: a request may expire before it is picked up.'; }
    else if (!/^(Queued|Failed)/.test(c.hint.textContent)) { c.hint.className = 'hint'; c.hint.textContent = ''; }
  }

  function update(c, s, now) {
    var vm = s.vm || {}, known = !!vm.booted_version, el = c.el;
    c.pending = s.pending;
    c.online = s.last_poll_at > 0 && now - s.last_poll_at < STALE_AFTER;
    el.querySelector('.health').className = 'health ' + (c.online ? 'ok' : 'stale');
    el.querySelector('.health-text').textContent = c.online ? 'VM online' : (s.last_poll_at ? 'VM not responding' : 'VM has not reported yet');
    el.querySelector('.health-ago').textContent = s.last_poll_at ? 'polled ' + ago(s.last_poll_at, now) : '';
    var booted = el.querySelector('.booted'), staged = el.querySelector('.staged');
    booted.textContent = known ? vm.booted_version : 'unknown';
    if (known) {
      var digest = document.createElement('span');
      digest.className = 'mono'; digest.textContent = ' ' + (vm.booted_digest || '').slice(0, 12);
      booted.appendChild(digest);
    }
    staged.textContent = !known ? 'unknown' : (vm.staged_version || 'none');
    if (known && vm.staged_version) {
      var note = document.createElement('span');
      note.className = 'note'; note.textContent = 'applies on the next reboot';
      staged.appendChild(note);
    }
    if (!c.pending && c.hint.textContent.indexOf('Queued') === 0) { c.hint.textContent = ''; }
    render(c);
  }

  function refresh() {
    fetch('api/v1/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('error').textContent = '';
      Object.keys(d.vms).forEach(function (name) { update(card(name), d.vms[name], d.now); });
    }).catch(function () { document.getElementById('error').textContent = 'Status unavailable.'; });
  }

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
