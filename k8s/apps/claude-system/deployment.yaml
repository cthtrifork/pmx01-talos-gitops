# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# Claude Code self-hosted environment runner. It claims sessions from your claude.ai environment and runs
# them in this pod as the `claude` ServiceAccount (read-only RBAC, see rbac.yaml).
# https://code.claude.com/docs/en/self-hosted-environments-deploy
#
# replicas is 0 until the image is published and both Secrets exist (README.md).
# --capacity 1: one session per pod, as the docs recommend for production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-runner
  namespace: claude-system
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-runner
  template:
    metadata:
      labels:
        app: claude-runner
        app.kubernetes.io/part-of: claude-code-self-hosted-runner
    spec:
      serviceAccountName: claude # in-cluster token is what lets sessions read the cluster
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/cthtrifork/pmx01-talos-gitops/claude-runner:rc-REPLACE # TODO set to the published tag, pin by digest
          args:
            - self-hosted-runner
            - --environment-secret-file
            - /etc/claude/environment-secret
            - --capacity
            - "1"
            - --base-dir
            - /workspace
          env:
            - name: DISABLE_AUTOUPDATER
              value: "1" # the binary is baked into the image
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: environment-secret
              mountPath: /etc/claude
              readOnly: true
            - name: github-token
              mountPath: /etc/github
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: home
              mountPath: /home/claude
            - name: tmp
              mountPath: /tmp
      volumes:
        # Both Secrets are created by hand, see README.md; they are not in this repository.
        - name: environment-secret
          secret:
            secretName: claude-runner-environment-secret
            defaultMode: 0400
        - name: github-token
          secret:
            secretName: claude-github-token
            defaultMode: 0400
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: home
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
