# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# Claude Code Remote Control, signed in as a person (no admin settings or environment key needed).
# Runs as the `claude` ServiceAccount (read-only RBAC, see rbac.yaml).
#
# The login lives on the claude-home PVC (~/.claude/.credentials.json, ~/.claude.json), so it survives
# restarts and the token refreshes in place. The pod idles until a login exists, then starts
# `claude remote-control`. One-time login: README.md.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-rc
  namespace: claude-system
spec:
  replicas: 1
  strategy:
    type: Recreate # the PVC is ReadWriteOnce, and one login must not run twice
  selector:
    matchLabels:
      app: claude-rc
  template:
    metadata:
      labels:
        app: claude-rc
    spec:
      serviceAccountName: claude # in-cluster token is what lets sessions read the cluster
      terminationGracePeriodSeconds: 30
      dnsConfig:
        options:
          - name: ndots # external names (api.anthropic.com) otherwise try 4 cluster search suffixes through the FQDN DNS proxy first
            value: "1"
      hostname: claude-k8s-helper # stable device name in claude.ai/code instead of the generated pod name
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Claude refuses to bind its cross-session messaging socket under a shared directory (every parent must be
      # private or sticky). An emptyDir is 0777 and fsGroup makes it 2777; emptyDir.mode (sticky bit) is alpha
      # from Kubernetes 1.37. The local-path PVCs are hostPath volumes, which fsGroup does not touch (root 0777),
      # so /tmp is a claude-owned 0700 subdirectory of the workspace PVC, made by the init container below
      # (the restricted PSA rules out a root one). Wiped on every pod start, like the emptyDir it replaces.
      initContainers:
        - name: private-tmp
          image: ghcr.io/cthtrifork/pmx01-talos-gitops/claude-runner:v0.10.0@sha256:2b0c980a41a5785c61c763d165002a4c7d4edee945312e40d71cf62063c94c11
          command:
            - "/bin/bash"
            - "-c"
            - "rm -rf /mnt/workspace/.tmp && mkdir -m 0700 /mnt/workspace/.tmp"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: workspace
              mountPath: /mnt/workspace
      containers:
        - name: claude
          image: ghcr.io/cthtrifork/pmx01-talos-gitops/claude-runner:v0.10.0@sha256:2b0c980a41a5785c61c763d165002a4c7d4edee945312e40d71cf62063c94c11
          command:
            - "/bin/bash"
            - "-c"
          args:
            - |
              # User-level memory from the claude-md ConfigMap (managed in Git). A symlink, not a subPath
              # mount, so the ConfigMap does not create root-owned directories inside the PVC.
              mkdir -p "$HOME/.claude" && ln -sfn /etc/claude-md/CLAUDE.md "$HOME/.claude/CLAUDE.md"
              until [ -s "$HOME/.claude/.credentials.json" ]; do
                echo "not logged in: kubectl -n claude-system exec -it deploy/claude-rc -- claude"
                sleep 30
              done
              # Flux MCP server, read-only. User scope is stored in ~/.claude.json on the PVC, so re-register on
              # every start (remove first, `mcp add` fails if the name exists).
              claude mcp remove --scope user flux >/dev/null 2>&1 || true
              claude mcp add --scope user flux -- flux-operator-mcp serve --read-only
              exec claude remote-control --name homelab
          env:
            - name: DISABLE_AUTOUPDATER
              value: "1" # the binary is baked into the image
            - name: DISABLE_TELEMETRY
              value: "1" # no telemetry (Datadog) or error reporting: those hosts are not in the egress allowlist
            - name: CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY
              value: "1" # no "How is Claude doing?" survey in a headless pod
            - name: CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL
              value: "1" # do not try to register the official plugin marketplace on start (host not in the egress allowlist)
            - name: DOCKER_CONFIG
              value: /etc/registry-auth # registry credentials for crane, from the optional Secret ghcr-pull
            - name: CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX
              value: claude-k8s-helper # session names instead of the pod hostname prefix
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: home
              mountPath: /home/claude
            - name: github-token
              mountPath: /etc/github
              readOnly: true
            - name: registry-auth
              mountPath: /etc/registry-auth
              readOnly: true
            - name: claude-md
              mountPath: /etc/claude-md
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: workspace
              mountPath: /tmp
              subPath: .tmp # private-tmp init container
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: claude-home
        - name: github-token
          secret:
            secretName: claude-github-token # minted by github-app.yaml
            optional: true
            defaultMode: 0400
        - name: registry-auth
          secret:
            secretName: ghcr-pull # SOPS-encrypted (root readme.md), type kubernetes.io/dockerconfigjson, a token with only read:packages
            optional: true
            defaultMode: 0400
            items:
              - key: .dockerconfigjson
                path: config.json # the file crane, skopeo and docker read from $DOCKER_CONFIG
        - name: claude-md
          configMap:
            name: claude-md # generated by kustomization.yaml; the name hash rolls the pod on change
        # A plain PVC, so clones survive pod restarts (a per-pod ephemeral volume was wiped by every rollout).
        # local-path does not enforce the size: clean up old clones.
        - name: workspace
          persistentVolumeClaim:
            claimName: claude-workspace
