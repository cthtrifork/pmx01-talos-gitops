# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# Claude Code Remote Control, signed in as a person (no admin settings or environment key needed).
# Runs as the `claude` ServiceAccount (read-only RBAC, see rbac.yaml).
#
# The login lives on the claude-home PVC (~/.claude/.credentials.json, ~/.claude.json), so it survives
# restarts and the token refreshes in place. The pod idles until a login exists, then starts
# `claude remote-control`. One-time login: README.md.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-rc
  namespace: claude-system
spec:
  replicas: 1
  strategy:
    type: Recreate # the PVC is ReadWriteOnce, and one login must not run twice
  selector:
    matchLabels:
      app: claude-rc
  template:
    metadata:
      labels:
        app: claude-rc
    spec:
      serviceAccountName: claude # in-cluster token is what lets sessions read the cluster
      terminationGracePeriodSeconds: 30
      dnsConfig:
        options:
          - name: ndots # external names (api.anthropic.com) otherwise try 4 cluster search suffixes through the FQDN DNS proxy first
            value: "1"
      hostname: claude-k8s-helper # stable device name in claude.ai/code instead of the generated pod name
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Claude refuses to bind its cross-session messaging socket under a shared directory, and every writable
      # volume here is world- or group-writable without the sticky bit (fsGroup makes an emptyDir 2777). /tmp is
      # therefore a private (0700, claude-owned) subdirectory of the workspace PVC. The restricted PSA rules out a
      # root init container, but the PVC root is writable by the fsGroup, so a claude-owned directory can be made
      # here. fsGroup re-applies g+rw to the PVC on each pod start, so it is wiped and re-chmodded every time.
      initContainers:
        - name: private-tmp
          image: ghcr.io/cthtrifork/pmx01-talos-gitops/claude-runner:v0.9.0@sha256:317a043a7d80fc3402216b54821f8bd2e94db4b10ed5100df35593c925219bd2
          command:
            - "/bin/bash"
            - "-c"
            - "rm -rf /mnt/workspace/.tmp && mkdir -m 0700 /mnt/workspace/.tmp"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: workspace
              mountPath: /mnt/workspace
      containers:
        - name: claude
          image: ghcr.io/cthtrifork/pmx01-talos-gitops/claude-runner:v0.9.0@sha256:317a043a7d80fc3402216b54821f8bd2e94db4b10ed5100df35593c925219bd2
          command:
            - "/bin/bash"
            - "-c"
          args:
            - |
              # User-level memory from the claude-md ConfigMap (managed in Git). A symlink, not a subPath
              # mount, so the ConfigMap does not create root-owned directories inside the PVC.
              mkdir -p "$HOME/.claude" && ln -sfn /etc/claude-md/CLAUDE.md "$HOME/.claude/CLAUDE.md"
              until [ -s "$HOME/.claude/.credentials.json" ]; do
                echo "not logged in: kubectl -n claude-system exec -it deploy/claude-rc -- claude"
                sleep 30
              done
              exec claude remote-control --name pmx01-talos
          env:
            - name: DISABLE_AUTOUPDATER
              value: "1" # the binary is baked into the image
            - name: DOCKER_CONFIG
              value: /etc/registry-auth # registry credentials for crane, from the optional Secret ghcr-pull
            - name: CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX
              value: claude-k8s-helper # session names instead of the pod hostname prefix
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: home
              mountPath: /home/claude
            - name: github-token
              mountPath: /etc/github
              readOnly: true
            - name: registry-auth
              mountPath: /etc/registry-auth
              readOnly: true
            - name: claude-md
              mountPath: /etc/claude-md
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: workspace
              mountPath: /tmp
              subPath: .tmp # private-tmp init container
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: claude-home
        - name: github-token
          secret:
            secretName: claude-github-token # minted by github-app.yaml
            optional: true
            defaultMode: 0400
        - name: registry-auth
          secret:
            secretName: ghcr-pull # created by hand (not in Git), type kubernetes.io/dockerconfigjson, a token with only read:packages
            optional: true
            defaultMode: 0400
            items:
              - key: .dockerconfigjson
                path: config.json # the file crane, skopeo and docker read from $DOCKER_CONFIG
        - name: claude-md
          configMap:
            name: claude-md # generated by kustomization.yaml; the name hash rolls the pod on change
        # A plain PVC, so clones survive pod restarts (a per-pod ephemeral volume was wiped by every rollout).
        # local-path does not enforce the size: clean up old clones.
        - name: workspace
          persistentVolumeClaim:
            claimName: claude-workspace
