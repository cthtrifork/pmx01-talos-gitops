# Usage collector for the Claude Code OpenTelemetry metrics of claude-rc and the Claude VM (homeserver-bootc). Redpanda
# Connect with the pipeline in redpanda-connect.yaml: OTLP/HTTP JSON in on :4318 (TLS, no authentication), Prometheus
# counters on :4195/metrics. The usage page and API (../usage) read them back from Prometheus. Reached on https://otel.portableinfo.cloud (the A record points at
# the MetalLB address below, LAN only, no ingress), and by claude-rc through the same name.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-otel
  namespace: claude-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-otel
  template:
    metadata:
      labels:
        app: claude-otel
        prometheus-scrape: "true" # reachable from Prometheus on 4195, see kube-prometheus-stack/networkpolicy.yaml
      annotations:
        reloader.stakater.com/auto: "true" # restart on a renewed certificate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001 # reads the certificate Secret
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect
          image: mirror.gcr.io/redpandadata/connect:4.117.0@sha256:b6df7ca0c506578c8cc8b0cd223c117366bbeac84365f95944d339f0165b551c # renovate: datasource=docker depName=docker.io/redpandadata/connect versioning=docker
          args:
            - -c
            - /etc/connect/redpanda-connect.yaml
            - --disable-telemetry
          ports:
            - { name: otlp, containerPort: 4318 }
            - { name: metrics, containerPort: 4195 }
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/connect/redpanda-connect.yaml
              subPath: redpanda-connect.yaml
              readOnly: true
            - name: tls
              mountPath: /etc/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: claude-otel-connect-config # generated by kustomization.yaml
        - name: tls
          secret:
            secretName: claude-otel-tls # cert-manager, certificate.yaml
            defaultMode: 0440
---
# LAN address for the Claude VM (and for claude-rc, which resolves the same name). 443 because the VM's egress gateway
# only passes HTTPS on 443. 192.168.1.243 is free in the MetalLB pool (192.168.1.221-254); the A record
# otel.portableinfo.cloud -> 192.168.1.243 is made in Cloudflare by hand.
apiVersion: v1
kind: Service
metadata:
  name: claude-otel-lb
  namespace: claude-system
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.243
spec:
  type: LoadBalancer
  ports:
    - name: otlp
      port: 443
      targetPort: otlp
      protocol: TCP
  selector:
    app: claude-otel
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/monitoring.coreos.com/podmonitor_v1.json
# The release label is what the kube-prometheus-stack Prometheus selects PodMonitors by.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: claude-otel
  namespace: claude-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: claude-otel
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
