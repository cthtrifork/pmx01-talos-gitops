# Creates the Secret claude-otel-token once, if it does not exist, so the token is not in Git:
#   token    the bearer token the collector checks
#   headers  the value for OTEL_EXPORTER_OTLP_HEADERS (Authorization=Bearer <token>)
# claude-rc reads `headers` through secretKeyRef. For the Claude VM read it once with Secret access (the pod's
# ServiceAccount cannot) and seed it there, see docs/claude-vm/README.md in homeserver-bootc.
# Never rotated by this Job. To rotate, delete the Secret and the Job; Flux recreates both and Reloader restarts the pods.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-otel-token
  namespace: claude-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-otel-token
  namespace: claude-system
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "claude-otel-token"
    verbs:
      - "get"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-otel-token
  namespace: claude-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-otel-token
subjects:
  - kind: ServiceAccount
    name: claude-otel-token
    namespace: claude-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: claude-otel-token
  namespace: claude-system
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: claude-otel-token
    spec:
      restartPolicy: OnFailure
      serviceAccountName: claude-otel-token
      automountServiceAccountToken: true # kubectl needs it to create the Secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create
          image: mirror.gcr.io/alpine/k8s:1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
          command:
            - sh
            - -ec
            - |
              if kubectl get secret claude-otel-token >/dev/null 2>&1; then
                echo "claude-otel-token exists, leaving it alone"
                exit 0
              fi
              token="$(head -c 32 /dev/urandom | base64 | tr -d '=+/\n')"
              kubectl create secret generic claude-otel-token \
                --from-literal=token="$token" \
                --from-literal=headers="Authorization=Bearer $token"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
