# Claude Code usage from OpenTelemetry metrics (Redpanda Connect, open-source inputs only: otlp_http needs an Enterprise
# licence). Claude Code POSTs OTLP/HTTP **JSON** (OTEL_EXPORTER_OTLP_PROTOCOL=http/json) to :4318/v1/metrics (TLS, no
# authentication: LAN only, restricted by the network policies); the datapoints become Prometheus counters on
# :4195/metrics (claude_code_*).
# Claude Code exports delta temporality, so every datapoint is an increment. Labels are only environment, model and type:
# user.email, user.id and session.id are dropped on purpose (personal data, unbounded cardinality).
# Not a Flux template (configMapGenerator disables postBuild envsubst), hence the plain ${! } interpolations.
http:
  enabled: true
  address: 0.0.0.0:4195
  debug_endpoints: false

metrics:
  prometheus: {}
  mapping: |
    meta path = deleted() # the component path, a different label value per series and noise next to the real labels
    meta label = deleted()

input:
  http_server:
    address: 0.0.0.0:4318
    path: /v1/metrics
    allowed_verbs:
      - POST
    cert_file: /etc/tls/tls.crt
    key_file: /etc/tls/tls.key
    sync_response:
      headers:
        Content-Type: application/json

pipeline:
  processors:
    - mapping: |
        map attrs {
          root = this.or([]).map_each(kv -> {kv.key: kv.value.values().index(0)}).fold({}, t -> t.tally.merge(t.value))
        }
        root = this.resourceMetrics.or([]).map_each(rm -> rm.scopeMetrics.or([]).map_each(sm -> sm.metrics.or([]).map_each(m -> (m.sum | m.gauge | {}).dataPoints.or([]).map_each(dp -> {
          "name": m.name,
          "environment": (rm.resource.attributes | []).apply("attrs").environment | "",
          "model": (dp.attributes | []).apply("attrs").model | "",
          "type": (dp.attributes | []).apply("attrs").type | "",
          "value": dp.asDouble | dp.asInt.number() | 0
        })).flatten()).flatten()).flatten()
    - unarchive:
        format: json_array
    - mapping: |
        let series = match this.name {
          "claude_code.token.usage" => "claude_code_tokens_total"
          "claude_code.cost.usage" => "claude_code_cost_microusd_total"
          "claude_code.session.count" => "claude_code_sessions_total"
          "claude_code.lines_of_code.count" => "claude_code_lines_of_code_total"
          "claude_code.commit.count" => "claude_code_commits_total"
          "claude_code.pull_request.count" => "claude_code_pull_requests_total"
          "claude_code.active_time.total" => "claude_code_active_time_ms_total"
          _ => ""
        }
        # cost is fractional USD and active time seconds; counters here are integers
        let v = this.value
        let n = match this.name {
          "claude_code.cost.usage" => $v * 1000000
          "claude_code.active_time.total" => $v * 1000
          _ => $v
        }.round().int64()
        # labels a series does not use are blanked, so the label sets of one series never differ
        root = if $series == "" {
          deleted()
        } else {
          {
            "series": $series,
            "value": $n,
            "environment": this.environment,
            "model": if ["claude_code_tokens_total", "claude_code_cost_microusd_total"].contains($series) { this.model } else { "" },
            "type": if ["claude_code_tokens_total", "claude_code_lines_of_code_total", "claude_code_active_time_ms_total"].contains($series) { this.type } else { "" }
          }
        }
    - switch:
        - check: this.series == "claude_code_tokens_total"
          processors:
            - metric:
                type: counter_by
                name: claude_code_tokens_total
                labels: { environment: '${! json("environment") }', model: '${! json("model") }', type: '${! json("type") }' }
                value: '${! json("value") }'
        - check: this.series == "claude_code_cost_microusd_total"
          processors:
            - metric:
                type: counter_by
                name: claude_code_cost_microusd_total
                labels: { environment: '${! json("environment") }', model: '${! json("model") }' }
                value: '${! json("value") }'
        - check: this.series == "claude_code_lines_of_code_total"
          processors:
            - metric:
                type: counter_by
                name: claude_code_lines_of_code_total
                labels: { environment: '${! json("environment") }', type: '${! json("type") }' }
                value: '${! json("value") }'
        - check: this.series == "claude_code_active_time_ms_total"
          processors:
            - metric:
                type: counter_by
                name: claude_code_active_time_ms_total
                labels: { environment: '${! json("environment") }', type: '${! json("type") }' }
                value: '${! json("value") }'
        - check: this.series == "claude_code_sessions_total"
          processors:
            - metric:
                type: counter_by
                name: claude_code_sessions_total
                labels: { environment: '${! json("environment") }' }
                value: '${! json("value") }'
        - check: this.series == "claude_code_commits_total"
          processors:
            - metric:
                type: counter_by
                name: claude_code_commits_total
                labels: { environment: '${! json("environment") }' }
                value: '${! json("value") }'
        - check: this.series == "claude_code_pull_requests_total"
          processors:
            - metric:
                type: counter_by
                name: claude_code_pull_requests_total
                labels: { environment: '${! json("environment") }' }
                value: '${! json("value") }'
    - archive:
        format: json_array
    - mapping: 'root = {}'

output:
  sync_response: {}
