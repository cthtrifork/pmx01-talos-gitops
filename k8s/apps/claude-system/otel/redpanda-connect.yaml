# Claude Code usage from OpenTelemetry metrics (Redpanda Connect, open-source inputs only: otlp_http needs an Enterprise
# licence). Claude Code POSTs OTLP/HTTP **JSON** (OTEL_EXPORTER_OTLP_PROTOCOL=http/json) to :4318/v1/metrics with a bearer
# token; the datapoints become
#   - Prometheus counters on :4195/metrics (claude_code_*), the history, scraped by Prometheus
#   - running totals in memory, shown by :8080 (GET / as a table, GET /usage as JSON), since the pod started
# Claude Code exports delta temporality, so every datapoint is an increment. Labels are only environment, model and type:
# user.email, user.id and session.id are dropped on purpose (personal data, unbounded cardinality).
# Not a Flux template (configMapGenerator disables postBuild envsubst), hence the plain ${! } interpolations.
http:
  enabled: true
  address: 0.0.0.0:4195
  debug_endpoints: false

metrics:
  prometheus: {}
  mapping: |
    meta path = deleted() # the component path, a different label value per series and noise next to the real labels
    meta label = deleted()

input:
  broker:
    inputs:
      - http_server:
          address: 0.0.0.0:4318
          path: /v1/metrics
          allowed_verbs:
            - POST
          cert_file: /etc/tls/tls.crt # cert-manager Secret claude-otel-tls
          key_file: /etc/tls/tls.key
          sync_response:
            status: '${! metadata("status").or("200") }'
            headers:
              Content-Type: application/json
      - http_server:
          address: 0.0.0.0:8080
          path: /
          allowed_verbs:
            - GET
          sync_response:
            status: '${! metadata("status").or("200") }'
            headers:
              Content-Type: '${! metadata("content_type").or("application/json") }'

cache_resources:
  - label: totals
    memory:
      init_values:
        totals: "{}"

pipeline:
  threads: 1 # one writer for the totals
  processors:
    - switch:
        # the usage view
        - check: '(@http_server_request_path | "") != "/v1/metrics"'
          processors:
            - branch:
                request_map: 'root = ""'
                processors:
                  - cache:
                      resource: totals
                      operator: get
                      key: totals
                result_map: 'meta totals = content().string()'
            - mapping: |
                let rows = meta("totals").parse_json().key_values().map_each(kv -> {
                  "series": kv.key.split("|").index(0),
                  "environment": kv.key.split("|").index(1),
                  "model": kv.key.split("|").index(2),
                  "type": kv.key.split("|").index(3),
                  "value": kv.value
                }).sort_by(r -> r.series + r.environment + r.model + r.type)
                if metadata("http_server_request_path") == "/usage" {
                  meta content_type = "application/json"
                  root = $rows
                } else if metadata("http_server_request_path") == "/" {
                  meta content_type = "text/html; charset=utf-8"
                  root = "<!doctype html><meta charset=utf-8><title>Claude usage</title>" +
                    "<style>body{font:14px system-ui;margin:2rem}td,th{padding:.25rem .75rem;text-align:left}td:last-child{text-align:right}</style>" +
                    "<h1>Claude Code usage since the collector started</h1>" +
                    "<table><tr><th>series<th>environment<th>model<th>type<th>value" +
                    $rows.map_each(r -> "<tr><td>" + [r.series, r.environment, r.model, r.type, r.value.string()].map_each(c -> c.escape_html()).join("<td>")).join("") +
                    "</table><p>Cost series are micro-USD, active time is milliseconds. History: Prometheus claude_code_*."
                } else {
                  meta status = "404"
                  root = {"error": "not found"}
                }
        # OTLP: bearer token first
        - check: '(@Authorization | "") != "Bearer " + env("OTLP_TOKEN").not_empty().string()'
          processors:
            - mapping: |
                meta status = "401"
                root = {"error": "unauthorized"}
        - processors:
            # one message per datapoint
            - mapping: |
                map attrs {
                  root = this.or([]).map_each(kv -> {kv.key: kv.value.values().index(0)}).fold({}, t -> t.tally.merge(t.value))
                }
                root = this.resourceMetrics.or([]).map_each(rm -> rm.scopeMetrics.or([]).map_each(sm -> sm.metrics.or([]).map_each(m -> (m.sum | m.gauge | {}).dataPoints.or([]).map_each(dp -> {
                  "name": m.name,
                  "environment": (rm.resource.attributes | []).apply("attrs").environment | "",
                  "model": (dp.attributes | []).apply("attrs").model | "",
                  "type": (dp.attributes | []).apply("attrs").type | "",
                  "value": dp.asDouble | dp.asInt.number() | 0
                })).flatten()).flatten()).flatten()
            - unarchive:
                format: json_array
            # series name, integer value and the label values
            - mapping: |
                let series = match this.name {
                  "claude_code.token.usage" => "claude_code_tokens_total"
                  "claude_code.cost.usage" => "claude_code_cost_microusd_total"
                  "claude_code.session.count" => "claude_code_sessions_total"
                  "claude_code.lines_of_code.count" => "claude_code_lines_of_code_total"
                  "claude_code.commit.count" => "claude_code_commits_total"
                  "claude_code.pull_request.count" => "claude_code_pull_requests_total"
                  "claude_code.active_time.total" => "claude_code_active_time_ms_total"
                  _ => ""
                }
                # cost is fractional USD and active time seconds; counters here are integers
                let v = this.value
                let n = match this.name {
                  "claude_code.cost.usage" => $v * 1000000
                  "claude_code.active_time.total" => $v * 1000
                  _ => $v
                }.round().int64()
                # labels a series does not use are blanked, so the label sets of one series never differ
                root = if $series == "" {
                  deleted()
                } else {
                  {
                    "series": $series,
                    "value": $n,
                    "environment": this.environment,
                    "model": if ["claude_code_tokens_total", "claude_code_cost_microusd_total"].contains($series) { this.model } else { "" },
                    "type": if ["claude_code_tokens_total", "claude_code_lines_of_code_total", "claude_code_active_time_ms_total"].contains($series) { this.type } else { "" }
                  }
                }
            - switch:
                - check: this.series == "claude_code_tokens_total"
                  processors:
                    - metric:
                        type: counter_by
                        name: claude_code_tokens_total
                        labels: { environment: '${! json("environment") }', model: '${! json("model") }', type: '${! json("type") }' }
                        value: '${! json("value") }'
                - check: this.series == "claude_code_cost_microusd_total"
                  processors:
                    - metric:
                        type: counter_by
                        name: claude_code_cost_microusd_total
                        labels: { environment: '${! json("environment") }', model: '${! json("model") }' }
                        value: '${! json("value") }'
                - check: this.series == "claude_code_lines_of_code_total"
                  processors:
                    - metric:
                        type: counter_by
                        name: claude_code_lines_of_code_total
                        labels: { environment: '${! json("environment") }', type: '${! json("type") }' }
                        value: '${! json("value") }'
                - check: this.series == "claude_code_active_time_ms_total"
                  processors:
                    - metric:
                        type: counter_by
                        name: claude_code_active_time_ms_total
                        labels: { environment: '${! json("environment") }', type: '${! json("type") }' }
                        value: '${! json("value") }'
                - check: this.series == "claude_code_sessions_total"
                  processors:
                    - metric:
                        type: counter_by
                        name: claude_code_sessions_total
                        labels: { environment: '${! json("environment") }' }
                        value: '${! json("value") }'
                - check: this.series == "claude_code_commits_total"
                  processors:
                    - metric:
                        type: counter_by
                        name: claude_code_commits_total
                        labels: { environment: '${! json("environment") }' }
                        value: '${! json("value") }'
                - check: this.series == "claude_code_pull_requests_total"
                  processors:
                    - metric:
                        type: counter_by
                        name: claude_code_pull_requests_total
                        labels: { environment: '${! json("environment") }' }
                        value: '${! json("value") }'
            # running totals for the usage view
            # one datapoint at a time: a branch reads the cache once per batch
            - for_each:
                - branch:
                    request_map: 'root = ""'
                    processors:
                      - cache:
                          resource: totals
                          operator: get
                          key: totals
                    result_map: 'meta totals = content().string()'
                - branch:
                    request_map: |
                      let key = [this.series, this.environment, this.model, this.type].join("|")
                      root = meta("totals").parse_json().assign({$key: (meta("totals").parse_json().get($key) | 0) + this.value}).format_json()
                    processors:
                      - cache:
                          resource: totals
                          operator: set
                          key: totals
                          value: '${! content() }'
            # the whole request is answered once, with an empty export response
            - archive:
                format: json_array
            - mapping: 'root = {}'

output:
  sync_response: {}
