apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - deployment.yaml
  - github-app.yaml
configMapGenerator:
  - name: claude-token-scripts
    namespace: claude-system
    options:
      annotations:
        # The scripts are shell, not Flux templates: skip postBuild envsubst (strict mode fails on $GITHUB_REPOSITORY)
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - github-app/sign-jwt.sh
      - github-app/refresh-token.sh
