---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - deployment.yaml
  - github-app.yaml
  - usage/usage.yaml
configMapGenerator:
  - name: claude-token-scripts
    namespace: claude-system
    options:
      annotations:
        # The scripts are shell, not Flux templates: skip postBuild envsubst (strict mode fails on $GITHUB_REPOSITORY)
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - github-app/sign-jwt.sh
      - github-app/refresh-token.sh
  - name: claude-usage-connect-config
    namespace: claude-system
    options:
      annotations:
        # Redpanda Connect interpolations and a web page, not Flux variables: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - usage/redpanda-connect.yaml
      - usage/index.html
  - name: claude-md
    namespace: claude-system
    options:
      annotations:
        # Markdown, not a Flux template: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - claude-md/CLAUDE.md
  - name: claude-skills
    namespace: claude-system
    options:
      annotations:
        # Markdown, not a Flux template: skip postBuild envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - cluster-alerts.md=claude-md/skills/cluster-alerts/SKILL.md
      - cilium-drops.md=claude-md/skills/cilium-drops/SKILL.md
      - cluster-disk-usage.md=claude-md/skills/cluster-disk-usage/SKILL.md
      - polaris-report.md=claude-md/skills/polaris-report/SKILL.md
      - image-inspect.md=claude-md/skills/image-inspect/SKILL.md
      - bandwidth-test.md=claude-md/skills/bandwidth-test/SKILL.md
      - ci-k8s-reference.md=claude-md/skills/ci-k8s-reference/SKILL.md
