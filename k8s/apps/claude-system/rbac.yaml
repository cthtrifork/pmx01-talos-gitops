# Read-only cluster access for the Claude Code pod. Built-in `view` covers workloads, services,
# events, logs and so on, and deliberately does NOT include Secrets. The extra role adds the CRDs
# this cluster uses, plus nodes, storage and cluster-wide RBAC objects (to audit Polaris RBAC findings). The only write verb is `patch` on the
# trivy-operator Deployment (rollout restart). Nothing here has pods/exec or Secrets.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude
  namespace: claude-system
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/clusterrole-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-extra-view
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - postgresql.cnpg.io
      - cert-manager.io
      - acme.cert-manager.io
      - traefik.io
      - cilium.io
      - monitoring.coreos.com
      - helm.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - fluxcd.controlplane.io
      - kubevirt.io
      - metallb.io
      - frrk8s.metallb.io
      - aquasecurity.github.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: claude
    namespace: claude-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-extra-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-extra-view
subjects:
  - kind: ServiceAccount
    name: claude
    namespace: claude-system
---
# `kubectl rollout restart` patches the pod template. The operator reads its scanJob.* settings at start and the chart does
# not roll it when they change. Add a name here only for a Deployment that needs this; patch can change images and volumes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-restart-trivy-operator
  namespace: security-system
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - trivy-operator
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-restart-trivy-operator
  namespace: security-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-restart-trivy-operator
subjects:
  - kind: ServiceAccount
    name: claude
    namespace: claude-system
