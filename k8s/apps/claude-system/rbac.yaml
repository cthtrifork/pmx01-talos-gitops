# Read-only cluster access for the Claude Code pod. Built-in `view` covers workloads, services,
# events, logs and so on, and deliberately does NOT include Secrets. The extra role adds the CRDs
# this cluster uses, plus nodes and storage. Nothing here has a write verb, pods/exec or Secrets.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude
  namespace: claude-system
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/clusterrole-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-extra-view
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - postgresql.cnpg.io
      - cert-manager.io
      - acme.cert-manager.io
      - traefik.io
      - cilium.io
      - monitoring.coreos.com
      - helm.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - fluxcd.controlplane.io
      - kubevirt.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: claude
    namespace: claude-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-extra-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-extra-view
subjects:
  - kind: ServiceAccount
    name: claude
    namespace: claude-system
