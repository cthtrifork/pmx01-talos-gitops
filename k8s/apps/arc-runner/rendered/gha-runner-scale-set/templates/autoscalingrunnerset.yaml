apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  annotations:
    actions.github.com/cleanup-manager-role-binding: arc-ubuntu-gha-rs-manager
    actions.github.com/cleanup-manager-role-name: arc-ubuntu-gha-rs-manager
    actions.github.com/cleanup-no-permission-service-account-name: arc-ubuntu-gha-rs-no-permission
    actions.github.com/values-hash: ca6ffaaf7e0bbd1864c0673745aa3287a6796548235c67931fa6efd0cb831d2
  labels:
    actions.github.com/scale-set-name: arc-ubuntu
    actions.github.com/scale-set-namespace: arc-runners-system
    app.kubernetes.io/component: autoscaling-runner-set
    app.kubernetes.io/instance: arc-ubuntu
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: arc-ubuntu
    app.kubernetes.io/part-of: gha-rs
    app.kubernetes.io/version: 0.14.2
    helm.sh/chart: gha-rs-0.14.2
  name: arc-ubuntu
  namespace: arc-runners-system
spec:
  ephemeralRunnerMetadata:
    annotations:
      kubernetes.io/egress-bandwidth: 300M
      kubernetes.io/ingress-bandwidth: 300M
  githubConfigSecret: github-auth
  githubConfigUrl: https://github.com/cthtrifork/homeserver-bootc
  listenerTemplate:
    spec:
      containers:
      - name: listener
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 15m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
  maxRunners: 1
  minRunners: 1
  runnerScaleSetName: arc-ubuntu
  template:
    spec:
      containers:
      - command:
        - /home/runner/run.sh
        env:
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
        - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
          value: "120"
        - name: STORAGE_DRIVER
          value: overlay
        - name: BUILDAH_ISOLATION
          value: chroot
        - name: BUILDAH_LAYERS
          value: "true"
        - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
          value: /var/lib/registry
        - name: RUNNER_UPDATE_CA_CERTS
          value: "1"
        image: ghcr.io/cthtrifork/pmx01-talos-gitops/github-actions-runner:v0.4.0@sha256:2d14bfcf5890fd1642f1ec055bf86dc3d90012cd550ef178109e2bb6861ec6e2
        imagePullPolicy: IfNotPresent
        name: runner
        resources:
          limits:
            memory: 16Gi
          requests:
            cpu: 500m
            memory: 4Gi
        securityContext:
          privileged: true
          runAsGroup: 1001
          runAsUser: 1001
          seLinuxOptions:
            type: container_file_t
        volumeMounts:
        - mountPath: /usr/local/share/ca-certificates/private-ca.crt
          name: ca-certs
          subPath: ca.crt
        - mountPath: /var/lib/containers/storage
          name: container-storage-rootful
        - mountPath: /home/runner/_work
          name: work
        - mountPath: /var/run
          name: dind-sock
        - mountPath: /home/runner/.local/share/containers/storage
          name: container-rootless-storage
        - mountPath: /var/lib/shared
          name: container-shared-storage
        - mountPath: /var/lib/registry
          name: container-shared-registry
        - mountPath: /var/lib/docker
          name: docker-lib
        - mountPath: /var/cache/dnf
          name: dnf-cache
        - mountPath: /home/runner/.cache/dnf
          name: dnf-cache
        - mountPath: /home/runner/.cache/tmp
          name: cross-run-cache
        - mountPath: /tmp
          name: tmp-memory
        - mountPath: /var/tmp
          name: podman-tmp
      imagePullSecrets:
      - name: github-auth
      initContainers:
      - command:
        - sh
        - -c
        - |
          set -e
          find /tmp/arc-cache -type f -mtime +14 -print -delete
          find /tmp/arc-cache -type d -empty -mtime +14 -print -delete || true
        image: docker.io/library/busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        imagePullPolicy: IfNotPresent
        name: data-retention
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /tmp/arc-cache
          name: cross-run-cache
      - command:
        - cp
        - -r
        - /home/runner/externals/.
        - /home/runner/tmpDir/
        image: ghcr.io/cthtrifork/pmx01-talos-gitops/github-actions-runner:v0.4.0@sha256:2d14bfcf5890fd1642f1ec055bf86dc3d90012cd550ef178109e2bb6861ec6e2
        imagePullPolicy: IfNotPresent
        name: init-dind-externals
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 25m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - mountPath: /home/runner/tmpDir
          name: dind-externals
      - args:
        - dockerd
        - --host=unix:///var/run/docker.sock
        - --group=$(DOCKER_GROUP_GID)
        env:
        - name: DOCKER_GROUP_GID
          value: "123"
        image: docker.io/library/docker:29.7.2-dind@sha256:3ef33f2e220b79ed3ef3b99d81746f06f306cd6340e2cb7331d17ae996e74cb6
        imagePullPolicy: IfNotPresent
        name: dind
        resources:
          limits:
            memory: 5Gi
          requests:
            cpu: 200m
            memory: 2Gi
        restartPolicy: Always
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command:
            - docker
            - info
          failureThreshold: 24
          initialDelaySeconds: 0
          periodSeconds: 5
        volumeMounts:
        - mountPath: /home/runner/_work
          name: work
        - mountPath: /var/run
          name: dind-sock
        - mountPath: /home/runner/externals
          name: dind-externals
        - mountPath: /var/lib/docker
          name: docker-lib
      restartPolicy: Never
      securityContext:
        fsGroup: 1001
      serviceAccountName: arc-ubuntu-gha-rs-no-permission
      volumes:
      - name: ca-certs
        secret:
          items:
          - key: ca.crt
            path: ca.crt
          secretName: arc-runner-cert
      - emptyDir:
          sizeLimit: 32Gi
        name: work
      - emptyDir: {}
        name: dind-sock
      - emptyDir:
          sizeLimit: 2Gi
        name: dind-externals
      - emptyDir:
          sizeLimit: 32Gi
        name: docker-lib
      - emptyDir:
          sizeLimit: 20Gi
        name: tmp-memory
      - name: container-storage-rootful
        persistentVolumeClaim:
          claimName: container-storage-rootful
      - name: container-rootless-storage
        persistentVolumeClaim:
          claimName: container-rootless-storage
      - name: podman-tmp
        persistentVolumeClaim:
          claimName: podman-tmp
      - hostPath:
          path: /var/tmp/local-storage-cache/gha-cache/dnf
          type: DirectoryOrCreate
        name: dnf-cache
      - name: container-shared-storage
        persistentVolumeClaim:
          claimName: container-shared-storage
      - name: container-shared-registry
        persistentVolumeClaim:
          claimName: container-shared-registry
      - name: cross-run-cache
        persistentVolumeClaim:
          claimName: cross-run-cache
