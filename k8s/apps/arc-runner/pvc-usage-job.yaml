---
# Temporary: prints per-PVC usage (read-only) to the Job's logs, as local-path PVCs report no kubelet stats.
# Remove this file and its entry in kustomization.yaml once the usage has been read.
apiVersion: batch/v1
kind: Job
metadata:
  name: pvc-usage-probe-fast
  namespace: arc-runners-system
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: du
          image: docker.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - |
              # Fast and approximate: layer sizes come from the container-storage metadata, and du is capped per entry
              # (an entry that hits the cap prints ">60s", which marks it as huge), run in parallel as the PVCs hold
              # millions of files.
              probe() {
                pvc=$1; d=/pvc/$pvc
                if [ -f "$d/overlay-layers/layers.json" ]; then
                  layers=$(grep -o '"diff-size":[0-9]*' "$d/overlay-layers/layers.json" | cut -d: -f2 |
                    awk '{s+=$1; n++} END {printf "%d layers, %.1f GiB", n, s/2^30}')
                  dirs=$(find "$d/overlay" -maxdepth 1 2>/dev/null | wc -l)
                  echo "$pvc metadata: $layers; overlay dirs: $dirs (orphans if far above the layer count)" > /tmp/"$pvc".meta
                fi
                for e in "$d"/* "$d"/.[!.]*; do
                  [ -e "$e" ] && echo "$e"
                done | xargs -r -P 8 -n 1 sh -c 'timeout 60 du -x -s -k "$0" 2>/dev/null || echo ">60s $0"' |
                  sort -rn | head -12 | sed "s|^|$pvc |" > /tmp/"$pvc".out
              }
              for d in /pvc/*; do probe "$(basename "$d")" & done
              wait
              cat /tmp/*.meta 2>/dev/null
              for f in /tmp/*.out; do cat "$f"; done
              df -h /pvc/podman-tmp | tail -1
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - DAC_READ_SEARCH
          resources:
            requests:
              cpu: 500m
            limits:
              memory: 256Mi
          volumeMounts:
            - { name: container-storage-rootful, mountPath: /pvc/container-storage-rootful, readOnly: true }
            - { name: container-rootless-storage, mountPath: /pvc/container-rootless-storage, readOnly: true }
            - { name: container-shared-storage, mountPath: /pvc/container-shared-storage, readOnly: true }
            - { name: container-shared-registry, mountPath: /pvc/container-shared-registry, readOnly: true }
            - { name: podman-tmp, mountPath: /pvc/podman-tmp, readOnly: true }
            - { name: dnf-cache, mountPath: /pvc/dnf-cache, readOnly: true }
            - { name: cross-run-cache, mountPath: /pvc/cross-run-cache, readOnly: true }
      volumes:
        - name: container-storage-rootful
          persistentVolumeClaim: { claimName: container-storage-rootful, readOnly: true }
        - name: container-rootless-storage
          persistentVolumeClaim: { claimName: container-rootless-storage, readOnly: true }
        - name: container-shared-storage
          persistentVolumeClaim: { claimName: container-shared-storage, readOnly: true }
        - name: container-shared-registry
          persistentVolumeClaim: { claimName: container-shared-registry, readOnly: true }
        - name: podman-tmp
          persistentVolumeClaim: { claimName: podman-tmp, readOnly: true }
        - name: dnf-cache
          persistentVolumeClaim: { claimName: dnf-cache, readOnly: true }
        - name: cross-run-cache
          persistentVolumeClaim: { claimName: cross-run-cache, readOnly: true }
