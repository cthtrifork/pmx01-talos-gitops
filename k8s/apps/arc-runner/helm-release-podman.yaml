---
# Experimental second scale set for the homeserver-gui build: the same runner as helm-release.yaml, minus the
# Docker-in-Docker sidecar. The homeserver-bootc workflows use buildah and podman only, so this proves (or
# disproves) that nothing needs the Docker daemon, and frees the memory, the 32Gi docker-lib and the Docker
# wait at job start.
#
# Select it from homeserver-bootc with the repository variable ARC_RUNNER=arc-ubuntu-podman; unset it to fall
# back to arc-ubuntu. minRunners is 0, so it costs nothing while unused.
#
# Builds run in parallel, and two builds on one containers storage corrupt it, so nothing is shared: every pod gets
# its own generic ephemeral volumes (local-path, on the same node as before), deleted with the pod. Every build is
# therefore cold (empty dnf cache and image storage). To soften that, registries.conf sends ghcr.io, quay.io and
# gcr.io pulls through the in-cluster zot caches first (ConfigMap podman-registries) and falls back to the origin.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners-homeserver-bootc-podman
  namespace: arc-runners-system
spec:
  interval: 30m
  releaseName: arc-runners-podman
  chartRef:
    kind: OCIRepository
    name: arc-runners-system
  install:
    createNamespace: false

  # https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set/values.yaml
  values:
    resourceMeta:
      ephemeralRunner:
        annotations:
          kubernetes.io/ingress-bandwidth: "300M"
          kubernetes.io/egress-bandwidth: "300M"
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-controller-system

    githubConfigUrl: https://github.com/cthtrifork/homeserver-bootc
    runnerScaleSetName: arc-ubuntu-podman # runs-on: arc-ubuntu-podman
    # runs-on: arc-ubuntu matches both scale sets; arc-ubuntu-podman selects this one (no Docker daemon: use arc-ubuntu-docker for jobs that need one)
    scaleSetLabels:
      - arc-ubuntu
      - arc-ubuntu-podman

    maxRunners: 3 # CPU and the node's local-path disk allow about 3 to 4 builds at once (see the PR)
    minRunners: 0 # experimental, so no idle pod; the first job waits for the pod to start

    githubConfigSecret: github-auth
    containerMode: {} # no dind, no kubernetes mode
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/cthtrifork/talos-gitops/github-actions-runner:v0.11.0@sha256:86d54c1c6df0e0c8ba46c423735639cb6d26bb74e3c1653e221fd1dfa5094055
            imagePullPolicy: IfNotPresent
            # Create XDG_RUNTIME_DIR (0700, owned by the runner user) before the runner starts: steps such as
            # `podman login` run before prepare-podman and fail when the directory does not exist.
            command:
              - /bin/bash
              - -c
              - install -d -m 700 "$XDG_RUNTIME_DIR" && exec /home/runner/run.sh

            resources:
              requests:
                cpu: 500m
                memory: 2Gi # median job 1.4Gi, p90 4Gi
              limits:
                memory: 12Gi # observed peak over 14 days on arc-ubuntu: 6Gi. No CPU limit: dnf, buildah and rechunk burst

            securityContext:
              seLinuxOptions:
                type: container_file_t
              privileged: true
              runAsUser: 1001
              runAsGroup: 1001

            env:
              # No DOCKER_HOST and no wait for a Docker daemon: there is none.
              # Rootless podman keeps its socket, auth file and run state in XDG_RUNTIME_DIR. The image's /run/user/1001
              # does not exist and /run is root owned here (the Docker-in-Docker pod gets a writable /run from its
              # /var/run socket volume), so use a directory under the writable /tmp, created by the command below.
              - name: XDG_RUNTIME_DIR
                value: /tmp/xdg-runtime
              - name: STORAGE_DRIVER
                value: overlay

              - name: BUILDAH_ISOLATION
                value: chroot

              - name: BUILDAH_LAYERS
                value: "true"

              - name: RUNNER_UPDATE_CA_CERTS
                value: "1"

            volumeMounts:
              - name: ca-certs
                mountPath: /usr/local/share/ca-certificates/private-ca.crt
                subPath: ca.crt
              # Persistent rootful Podman/Buildah storage (the image build).
              - name: container-storage-rootful
                mountPath: /var/lib/containers/storage
              # Job workspace: node-local ephemeral storage.
              - name: work
                mountPath: /home/runner/_work
              # Persistent rootless storage (Run on PR and Trivy pull and scan PR images rootless).
              - name: container-rootless-storage
                mountPath: /home/runner/.local/share/containers/storage
              # Persistent DNF caches.
              - name: dnf-cache
                mountPath: /var/cache/dnf
              - name: dnf-cache
                mountPath: /home/runner/.cache/dnf
              # Downloaded release binaries and the like, shared between builds.
              - name: cross-run-cache
                mountPath: /home/runner/.cache/tmp
              # Scratch space. Not persistent, so leftovers cannot pile up between builds.
              - name: tmp
                mountPath: /tmp
              # buildah stages layers here while committing.
              - name: var-tmp
                mountPath: /var/tmp
              # Pulls go through zot first.
              - name: registries
                mountPath: /etc/containers/registries.conf.d/zot-mirror.conf
                subPath: zot-mirror.conf
                readOnly: true
              # Host udev database, bind-mounted into `bootc install` containers (read-only).
              - name: host-udev
                mountPath: /run/udev
                readOnly: true
              # Live host devtmpfs for `bootc install --via-loopback` (the e2e job); see helm-release.yaml.
              - name: host-dev
                mountPath: /host-dev
        imagePullSecrets:
          - name: github-auth
        securityContext:
          fsGroup: 1001
        volumes:
          - name: ca-certs
            configMap:
              name: portableinfo-ca-bundle
              items:
                - key: ca-bundle.crt
                  path: ca.crt
          - name: registries
            configMap:
              name: podman-registries
          - name: host-udev
            hostPath:
              path: /run/udev
              type: Directory
          - name: host-dev
            hostPath:
              path: /dev
              type: Directory
          - name: work
            emptyDir:
              sizeLimit: 32Gi
          - name: tmp
            emptyDir:
              sizeLimit: 20Gi
          - name: var-tmp
            emptyDir:
              sizeLimit: 30Gi
          - name: container-storage-rootful
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 32Gi
          - name: container-rootless-storage
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 32Gi
          - name: dnf-cache
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 25Gi
          - name: cross-run-cache
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi
    listenerTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 15m
                memory: 64Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: podman-registries
  namespace: arc-runners-system
data:
  # Mirrors are tried in order and the origin is the fallback. The zot paths are its pull-through caches
  # (k8s/infra/registry-system), and private images under ghcr.io/cthtrifork fall back to the origin.
  zot-mirror.conf: |
    [[registry]]
    prefix = "ghcr.io"
    location = "ghcr.io"
    [[registry.mirror]]
    location = "zot.registry-system.svc.cluster.local:5000/ghcr-cache"

    [[registry]]
    prefix = "quay.io"
    location = "quay.io"
    [[registry.mirror]]
    location = "zot.registry-system.svc.cluster.local:5000/quay-cache"

    [[registry]]
    prefix = "gcr.io"
    location = "gcr.io"
    [[registry.mirror]]
    location = "zot.registry-system.svc.cluster.local:5000/gcr-cache"
