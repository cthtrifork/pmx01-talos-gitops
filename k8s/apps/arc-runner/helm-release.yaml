---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners-homeserver-bootc
  namespace: arc-runners-system
spec:
  interval: 10m
  releaseName: arc-runners
  chartRef:
    kind: OCIRepository
    name: arc-runners-system
  install:
    createNamespace: false

  # https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set/values.yaml
  values:
    resourceMeta:
      ephemeralRunner:
        annotations:
          kubernetes.io/ingress-bandwidth: "10M"
          kubernetes.io/egress-bandwidth: "10M"
    controllerServiceAccount:
      # this SA is created by the controller chart, in arc-systems
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-controller-system

    # name of the runner scale set -> what you use in `runs-on: arc-ubuntu`
    githubConfigUrl: https://github.com/cthtrifork/homeserver-bootc
    runnerScaleSetName: arc-ubuntu

    maxRunners: 1 # only 1 runner due to pvc design
    minRunners: 1 # always ready

    #nodeSelector:
    #  kubernetes.io/hostname: talos-ska-6at

    # point to the secret we created with SOPS
    githubConfigSecret: github-auth
    containerMode: {} # we use custom
    template:
      spec:
        initContainers:
          - name: data-retention
            image: docker.io/library/busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - |
                set -e
                find /tmp/arc-cache -type f -mtime +14 -print -delete
                find /tmp/arc-cache -type d -empty -mtime +14 -print -delete || true
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              privileged: true
              allowPrivilegeEscalation: true
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 25m
                memory: 128Mi
            volumeMounts:
              - name: cross-run-cache
                mountPath: /tmp/arc-cache

          - name: fix-perms
            image: docker.io/library/busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - |
                set -eux
                # Create if missing and set perms/ownership (idempotent)
                install -d -m 0775 -o 1001 -g 1001 /tmp/dnf
                install -d -m 0775 -o 1001 -g 1001 /tmp/rootless
                # Also fix subpaths if they already exist
                chown -R 1001:1001 /tmp/dnf /tmp/rootless || true
                chmod 0775 /tmp/dnf /tmp/rootless || true
                # Feed existing data into the mounted volumes
                #cp -r /home/runner/.local/share/containers/storage/. /tmp/rootless || true
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              privileged: true
              allowPrivilegeEscalation: true
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 25m
                memory: 128Mi
            volumeMounts:
              - name: dnf-cache
                mountPath: /tmp/dnf
              - name: container-rootless-storage
                mountPath: /tmp/rootless
          - name: init-dind-externals
            image: ghcr.io/cthtrifork/pmx01-talos-gitops/github-actions-runner:v0.3.0@sha256:bd7d92d46c8bc066a295626ba818f1976ef9f3bdd63e58b6b26aa0aadea91855
            imagePullPolicy: IfNotPresent
            command:
              - "cp"
              - "-r"
              - "/home/runner/externals/."
              - "/home/runner/tmpDir/"
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 25m
                memory: 128Mi
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          - name: dind
            # renovate: datasource=docker depName=docker.io/library/docker versioning=docker
            image: docker.io/library/docker:29.7.2-dind@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
            imagePullPolicy: IfNotPresent
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            resources:
              requests:
                cpu: 200m
                memory: 2Gi
              limits:
                memory: 5Gi
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command:
                  - docker
                  - info
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            volumeMounts:
              # Shared runner/DinD workspace, but local to this pod.
              - name: work
                mountPath: /home/runner/_work
              # Docker Unix socket.
              - name: dind-sock
                mountPath: /var/run
              # Runner externals copied by init container.
              - name: dind-externals
                mountPath: /home/runner/externals
              # Transient Docker image/layer storage.
              - name: docker-lib
                mountPath: /var/lib/docker
        containers:
          - name: runner
            image: ghcr.io/cthtrifork/pmx01-talos-gitops/github-actions-runner:v0.3.0@sha256:bd7d92d46c8bc066a295626ba818f1976ef9f3bdd63e58b6b26aa0aadea91855
            imagePullPolicy: IfNotPresent
            command: ["/home/runner/run.sh"]

            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                memory: 16Gi

            securityContext:
              seLinuxOptions:
                type: container_file_t
              privileged: true
              runAsUser: 1001
              runAsGroup: 1001

            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock

              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"

              - name: STORAGE_DRIVER
                value: overlay

              - name: BUILDAH_ISOLATION
                value: chroot

              - name: BUILDAH_LAYERS
                value: "true"

              - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
                value: /var/lib/registry

              - name: RUNNER_UPDATE_CA_CERTS
                value: "1"

              #- name: HTTP_PROXY
              #  value: "http://192.168.1.135:3128"
              #- name: HTTPS_PROXY
              #  value: "http://192.168.1.135:3128"
              #- name: NO_PROXY
              #  value: "localhost,127.0.0.1"

            volumeMounts:
              - name: ca-certs
                mountPath: /usr/local/share/ca-certificates/private-ca.crt
                subPath: ca.crt
              # Persistent rootful Podman/Buildah storage.
              - name: container-storage-rootful
                mountPath: /var/lib/containers/storage
              # Job workspace: fast node-local ephemeral storage.
              - name: work
                mountPath: /home/runner/_work
              # Docker socket shared with DinD.
              - name: dind-sock
                mountPath: /var/run
              # Persistent rootless container storage.
              - name: container-rootless-storage
                mountPath: /home/runner/.local/share/containers/storage
              # Persistent additional image store.
              - name: container-shared-storage
                mountPath: /var/lib/shared
              # Persistent local registry/cache.
              - name: container-shared-registry
                mountPath: /var/lib/registry
              # Same transient Docker storage as DinD.
              - name: docker-lib
                mountPath: /var/lib/docker
              # Persistent DNF caches.
              - name: dnf-cache
                mountPath: /var/cache/dnf
              - name: dnf-cache
                mountPath: /home/runner/.cache/dnf
              # Existing persistent temporary/cache area.
              - name: cross-run-cache
                mountPath: /home/runner/.cache/tmp
              # RAM-backed scratch space.
              - name: tmp-memory
                mountPath: /tmp
              - name: podman-tmp
                mountPath: /var/tmp
        imagePullSecrets:
          - name: github-auth
        securityContext:
          fsGroup: 1001
        volumes:
          - name: ca-certs
            secret:
              secretName: arc-runner-cert
              items:
                - key: ca.crt
                  path: ca.crt
          - name: work
            emptyDir:
              sizeLimit: 32Gi
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir:
              sizeLimit: 2Gi
          # Docker-in-Docker transient image/layer storage.
          - name: docker-lib
            emptyDir:
              sizeLimit: 32Gi
          - name: tmp-memory
            emptyDir:
              #medium: Memory
              sizeLimit: 20Gi
          - name: container-storage-rootful
            persistentVolumeClaim:
              claimName: container-storage-rootful
          - name: container-rootless-storage
            persistentVolumeClaim:
              claimName: container-rootless-storage
          - name: podman-tmp
            persistentVolumeClaim:
              claimName: podman-tmp
          - name: dnf-cache
            #persistentVolumeClaim:
            #  claimName: dnf-cache
            hostPath:
              # talosctl --talosconfig ./talosconfig.yaml --nodes talos-wb5-z9x get volumestatus u-local-storage-cache
              # talosctl --talosconfig ./talosconfig.yaml --nodes talos-ska-6at get mountstatus u-local-storage-cache
              path: /var/tmp/local-storage-cache/gha-cache/dnf
              type: DirectoryOrCreate
          - name: container-shared-storage
            persistentVolumeClaim:
              claimName: container-shared-storage
          - name: container-shared-registry
            persistentVolumeClaim:
              claimName: container-shared-registry
          - name: cross-run-cache
            persistentVolumeClaim:
              claimName: cross-run-cache
    listenerTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 15m
                memory: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: podman-tmp
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cross-run-cache
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: container-shared-registry
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 24Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: container-shared-storage # additionalimagestores
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 24Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: container-storage-rootful
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 32Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: container-rootless-storage
  namespace: arc-runners-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 32Gi
