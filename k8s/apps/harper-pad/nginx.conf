# TLS front for harper-pad-sync. Stands in for the ingress in docs/sync.md: redirect, HSTS and
# security headers, per-IP rate limit and a request body cap. CORS stays in the app.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Access log without request bodies or query strings.
  log_format sync '$remote_addr "$request_method $uri" $status $body_bytes_sent';
  access_log /dev/stdout sync;

  server_tokens off;
  # externalTrafficPolicy: Local keeps the real client IP in $remote_addr.
  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
  limit_req_status 429;

  server {
    listen 8080;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name sync.portableinfo.cloud;

    ssl_certificate     /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    # Largest allowed request is 8 MiB.
    client_max_body_size 9m;

    location / {
      limit_req zone=perip burst=30 nodelay;
      proxy_pass http://127.0.0.1:9000;
      proxy_set_header Host $host;
      # Overwrite, never append: the app trusts this header only because nothing else reaches it.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 30s;
    }
  }
}
