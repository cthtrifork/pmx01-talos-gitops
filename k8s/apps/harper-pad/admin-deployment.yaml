# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# harper-pad-admin: NO Service. The app listens on 127.0.0.1 only; a cloudflared native sidecar maps the
# admin hostname (remotely managed tunnel, behind Cloudflare Access with OIDC) to http://localhost:9001.
#
# Needs the Secret harper-pad-admin-tunnel (key `token`), a SOPS-encrypted file (see "Secrets (SOPS)" in the root readme.md).
# The app listens on loopback, which kubelet cannot probe, and its image has no shell or health command, so the app has
# no probes (Polaris exemption); the cloudflared sidecar is probed with `cloudflared tunnel ready`.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harper-pad-admin
  namespace: harper-pad
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: harper-pad-admin
  template:
    metadata:
      labels:
        app: harper-pad-admin
    spec:
      serviceAccountName: harper-pad-admin
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Native sidecar: up before the app, outlives it.
        - name: cloudflared
          image: mirror.gcr.io/cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
          restartPolicy: Always
          args:
            - "tunnel"
            - "--no-autoupdate"
            - "--metrics"
            - "127.0.0.1:2000"
            - "run"
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harper-pad-admin-tunnel
                  key: token
          # kubelet cannot reach the loopback metrics port, so ask cloudflared itself (exec)
          livenessProbe:
            exec:
              command:
                - "cloudflared"
                - "tunnel"
                - "--metrics"
                - "127.0.0.1:2000"
                - "ready"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - "cloudflared"
                - "tunnel"
                - "--metrics"
                - "127.0.0.1:2000"
                - "ready"
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      containers:
        - name: admin
          # No args: the image's CMD is "serve"; it listens on LISTEN_ADDR (loopback).
          image: ghcr.io/cthtrifork/harper-pad-admin:v4.0.0@sha256:266e9c7f3e34ea944adb1e7fae247fa6b00c6d41f37d6a9b63322166251b00ab
          env:
            - name: LISTEN_ADDR
              value: 127.0.0.1:9001
            - name: PGHOST
              value: harper-pad-db-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: harper
            - name: PGUSER
              value: harper_admin
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /db-client/ca.crt
            - name: PGSSLCERT
              value: /db-client/tls.crt
            - name: PGSSLKEY
              value: /db-client/tls.key
            - name: SYNC_PUBLIC_URL
              value: https://harper-sync.portableinfo.cloud/
          volumeMounts:
            - name: db-client
              mountPath: /db-client
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: db-client
          secret:
            secretName: harper-pad-db-client-admin
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
