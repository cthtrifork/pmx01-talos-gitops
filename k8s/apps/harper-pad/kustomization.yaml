apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - postgres-certificates.yaml
  - postgres-cluster.yaml
  - sync-certificate.yaml
  - sync-deployment.yaml
  - sync-service.yaml
  - admin-deployment.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: harper-pad-sync-nginx
    namespace: harper-pad
    files:
      - nginx.conf
generatorOptions:
  disableNameSuffixHash: true
