# Neither app talks to the Kubernetes API, so no token is mounted. Both pull from ghcr.io with the github-auth pull secret,
# which a Kyverno policy clones into this namespace (k8s/infra/post/kyverno-policies/clone-github-auth.yaml).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harper-pad-sync
  namespace: harper-pad
automountServiceAccountToken: false
imagePullSecrets:
  - name: github-auth
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harper-pad-admin
  namespace: harper-pad
automountServiceAccountToken: false
imagePullSecrets:
  - name: github-auth
