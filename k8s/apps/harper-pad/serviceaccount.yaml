# Neither app talks to the Kubernetes API, so no token is mounted. Both pull from ghcr.io with the github-auth pull secret.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harper-pad-sync
  namespace: harper-pad
automountServiceAccountToken: false
imagePullSecrets:
  - name: github-auth
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harper-pad-admin
  namespace: harper-pad
automountServiceAccountToken: false
imagePullSecrets:
  - name: github-auth
