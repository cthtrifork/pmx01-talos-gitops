# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/cluster_v1.json
# One instance, no backups: every device holds a full copy and Sync all repopulates an empty server.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harper-pad-db
  namespace: harper-pad
spec:
  instances: 1
  enableSuperuserAccess: false
  storage:
    size: 2Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 30m
      memory: 128Mi
    limits:
      memory: 256Mi
  bootstrap:
    initdb:
      database: harper
      # harper_admin owns the database and so its tables, and harper-pad-admin runs the migrations as this role. harper_sync (the
      # public API's role) is only a login role below; the migrations grant it row-level rights and it has no DDL. Changing this on a
      # cluster that already exists does nothing: initdb runs once, so see "Changing the database owner" in README.md.
      owner: harper_admin
      encoding: UTF8
  managed:
    roles:
      # No password: access is by client certificate only (see pg_hba below).
      - name: harper_sync
        ensure: present
        login: true
        comment: harper-pad-sync, the public API; rows only, no DDL and no ownership (the migrations grant what it needs)
  certificates:
    serverTLSSecret: harper-pad-db-server
    serverCASecret: harper-pad-db-ca
    clientCASecret: harper-pad-db-ca
    replicationTLSSecret: harper-pad-db-replication
  postgresql:
    pg_hba:
      # Placed before CNPG's default "host all all all scram-sha-256" rule.
      # cert auth matches the certificate CN against the role name.
      - hostssl harper harper_sync all cert
      - hostssl harper harper_admin all cert
  monitoring:
    enablePodMonitor: true
