# Public sync API. Cloudflare terminates TLS at its edge and forwards through the tunnel to Traefik's
# plain-HTTP "web" entrypoint (the redirect to HTTPS is Cloudflare's "Always Use HTTPS"). The app takes
# its scheme from PUBLIC_URL, not from headers.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sync-headers
  namespace: harper-pad
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: no-referrer
    customResponseHeaders:
      Cache-Control: no-store
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sync-bodylimit
  namespace: harper-pad
spec:
  buffering:
    maxRequestBodyBytes: 3145728 # 3 MiB; the service takes at most 2 MiB of draft text plus 4 KiB around it and refuses more itself
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harper-pad-sync
  namespace: harper-pad
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      # /readyz runs a database query, so it is for the kubelet only (it probes the pod directly); /healthz stays public.
      match: Host(`harper-sync.portableinfo.cloud`) && !Path(`/readyz`)
      middlewares:
        - name: sync-headers
        - name: sync-bodylimit
      services:
        - name: harper-pad-sync
          port: http
