# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# harper-pad-sync: the API on :9000, reachable only from Traefik (see networkpolicy.yaml). TLS, DNS and the
# public hostname are Cloudflare's: a tunnel in the Traefik pod (k8s/infra/ingress-system) carries the traffic.
#
# The pull secret comes from the ServiceAccount (serviceaccount.yaml). No args: the image's CMD is "serve". The
# probes, ports and env follow the app's contract (backend/README.md in harper-pad).
#
# Probes: /healthz is liveness and never touches PostgreSQL; /readyz is readiness and does a database round trip
# (2 s limit, cached for 2 s), so timeoutSeconds is 3. Metrics are on the separate port 9102 (podmonitor.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harper-pad-sync
  namespace: harper-pad
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate # the DPoP replay cache is per pod: never two at once
  selector:
    matchLabels:
      app: harper-pad-sync
  template:
    metadata:
      labels:
        app: harper-pad-sync
    spec:
      serviceAccountName: harper-pad-sync
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: ghcr.io/cthtrifork/harper-pad-sync:v2.2.0@sha256:c65e4e1174d98a4a097771e5bcd2f9159cb5a236ab497c9509a295a98597b1a3
          env:
            # Must be https: or the service refuses to start; the scheme is taken from here, not from headers.
            - name: PUBLIC_URL
              value: https://harper-sync.portableinfo.cloud
            # The browser origins that may call the API, exact and comma-separated (no path, no trailing slash, never "*").
            # Empty allows none, and then the web app and the desktop app cannot sync. https://harper.portableinfo.cloud is the
            # Pages site. Add the desktop window's origin once it is known: the service logs an origin it rejected, once, so read
            # it from the log (kubectl -n harper-pad logs deploy/harper-pad-sync | grep -i cors). PR previews do not sync.
            - name: CORS_ALLOWED_ORIGINS
              value: https://harper.portableinfo.cloud
            - name: LISTEN_ADDR
              value: ":9000"
            # Standard libpq settings; no password, client certificate only.
            - name: PGHOST
              value: harper-pad-db-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: harper
            - name: PGUSER
              value: harper_sync
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /db-client/ca.crt
            - name: PGSSLCERT
              value: /db-client/tls.crt
            - name: PGSSLKEY
              value: /db-client/tls.key
          ports:
            - name: app
              containerPort: 9000
            - name: metrics
              containerPort: 9102
          volumeMounts:
            - name: db-client
              mountPath: /db-client # a directory mount, not subPath, so renewals reach the pod
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: app
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: app
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: db-client
          secret:
            secretName: harper-pad-db-client-sync
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
