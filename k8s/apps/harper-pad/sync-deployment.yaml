# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# harper-pad-sync: the API on :9000, reachable only from Traefik (see networkpolicy.yaml). TLS, DNS and the
# public hostname are Cloudflare's: a tunnel in the Traefik pod (k8s/infra/ingress-system) carries the traffic.
#
# PLACEHOLDER image: traefik/whoami (an echo server that answers 200 on every path, so the probes below pass) until the
# first harper-pad-sync image is published (harper-pad PR #82, workflow backend-image.yml; its job summary prints the
# digest). It echoes request headers at https://sync.portableinfo.cloud/ , which is handy for checking Cloudflare's
# client-IP headers. To switch: set image to ghcr.io/cthtrifork/harper-pad-sync pinned by digest and replace the
# args with ["serve"]; nothing else changes (ports, env and probes already follow the app's contract, see
# backend/README.md in harper-pad).
#
# Probes: /healthz is liveness and never touches PostgreSQL; /readyz is readiness and does a database round trip
# (2 s limit, cached for 2 s), so timeoutSeconds is 3. Metrics are on the separate port 9102 (podmonitor.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harper-pad-sync
  namespace: harper-pad
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate # in-memory rate limiter and DPoP replay cache are per pod: never two at once
  selector:
    matchLabels:
      app: harper-pad-sync
  template:
    metadata:
      labels:
        app: harper-pad-sync
    spec:
      serviceAccountName: harper-pad-sync
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: docker.io/traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
          args:
            - "--port"
            - "9000"
          env:
            # Must be https: or the service refuses to start; the scheme is taken from here, not from headers.
            - name: PUBLIC_URL
              value: https://sync.portableinfo.cloud
            - name: LISTEN_ADDR
              value: ":9000"
            # Standard libpq settings; no password, client certificate only.
            - name: PGHOST
              value: harper-pad-db-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: harper
            - name: PGUSER
              value: harper_sync
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /db-client/ca.crt
            - name: PGSSLCERT
              value: /db-client/tls.crt
            - name: PGSSLKEY
              value: /db-client/tls.key
          ports:
            - name: app
              containerPort: 9000
            - name: metrics
              containerPort: 9102
          volumeMounts:
            - name: db-client
              mountPath: /db-client # a directory mount, not subPath, so renewals reach the pod
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: app
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: app
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: db-client
          secret:
            secretName: harper-pad-db-client-sync
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
