# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# harper-pad-sync: the API on :9000, reachable only from Traefik (see networkpolicy.yaml). TLS, DNS and the
# public hostname are Cloudflare's: a tunnel in the Traefik pod (k8s/infra/ingress-system) carries the traffic.
#
# PLACEHOLDER: runs traefik/whoami (an echo server with /health) until the real image exists
# (backend/ is not built yet, harper-pad PR #80 is docs only). It echoes request headers at
# https://sync.portableinfo.cloud/ , which is handy for checking Cloudflare's client-IP headers.
# To switch: set image to ghcr.io/cthtrifork/harper-pad-sync pinned by digest, args to ["serve"],
# and the probe paths to /healthz and /readyz.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harper-pad-sync
  namespace: harper-pad
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate # in-memory rate limiter and DPoP replay cache are per pod: never two at once
  selector:
    matchLabels:
      app: harper-pad-sync
  template:
    metadata:
      labels:
        app: harper-pad-sync
    spec:
      serviceAccountName: harper-pad-sync
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: docker.io/traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
          args:
            - "--port"
            - "9000"
          env:
            # Must be https: or the service refuses to start; the scheme is taken from here, not from headers.
            - name: PUBLIC_URL
              value: https://sync.portableinfo.cloud
            - name: LISTEN_ADDR
              value: ":9000"
            # Standard libpq settings; no password, client certificate only.
            - name: PGHOST
              value: harper-pad-db-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: harper
            - name: PGUSER
              value: harper_sync
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /db-client/ca.crt
            - name: PGSSLCERT
              value: /db-client/tls.crt
            - name: PGSSLKEY
              value: /db-client/tls.key
          ports:
            - name: app
              containerPort: 9000
          volumeMounts:
            - name: db-client
              mountPath: /db-client # a directory mount, not subPath, so renewals reach the pod
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: app
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: app
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: db-client
          secret:
            secretName: harper-pad-db-client-sync
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
