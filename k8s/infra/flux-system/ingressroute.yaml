# Public path to the Flux webhook receiver. Same pattern as the sync API: Cloudflare terminates TLS and forwards through
# the Traefik tunnel to the plain-HTTP "web" entrypoint. Only /hook/ is routed, so nothing else of notification-controller
# is reachable. A request needs the unguessable path (a hash of the token) and a valid GitHub HMAC signature.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: flux-hook-ratelimit
  namespace: flux-system
spec:
  rateLimit:
    average: 5
    burst: 10
    period: 1s
    sourceCriterion:
      # the real client address as set by Cloudflare; every request arrives from the tunnel
      requestHeaderName: Cf-Connecting-Ip
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: flux-hook-bodylimit
  namespace: flux-system
spec:
  buffering:
    maxRequestBodyBytes: 26214400 # GitHub caps webhook payloads at 25 MiB
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`flux-hook.portableinfo.cloud`) && PathPrefix(`/hook/`)
      middlewares:
        - name: flux-hook-ratelimit
        - name: flux-hook-bodylimit
      services:
        - name: webhook-receiver
          port: 80
