# Source: localpv-provisioner/templates/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openebs-localpv-localpv-provisioner
  namespace: openebs-system
  labels:
    chart: localpv-provisioner-4.6.0
    heritage: Helm
    app: localpv-provisioner
    release: openebs-localpv
    component: "localpv-provisioner"
    openebs.io/component-name: openebs-localpv-provisioner
---
# Source: localpv-provisioner/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openebs-localpv-localpv-provisioner
  labels:
    chart: localpv-provisioner-4.6.0
    heritage: Helm
    app: localpv-provisioner
    release: openebs-localpv
    component: "localpv-provisioner"
    openebs.io/component-name: openebs-localpv-provisioner
  namespace: openebs-system
rules:
  - apiGroups: ["*"]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["*"]
    resources: ["namespaces", "pods", "events", "endpoints"]
    verbs: ["*"]
  - apiGroups: ["*"]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["list", "watch"]
  - apiGroups: ["*"]
    resources: ["storageclasses", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "create", "update", "delete", "patch"]
  - apiGroups: ["openebs.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
    # Analytics state ConfigMap: the provisioner creates and updates this
    # ConfigMap itself to persist install/ping/heartbeat timestamps.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
# Source: localpv-provisioner/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openebs-localpv-localpv-provisioner
  labels:
    chart: localpv-provisioner-4.6.0
    heritage: Helm
    app: localpv-provisioner
    release: openebs-localpv
    component: "localpv-provisioner"
    openebs.io/component-name: openebs-localpv-provisioner
  namespace: openebs-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openebs-localpv-localpv-provisioner
subjects:
  - kind: ServiceAccount
    name: openebs-localpv-localpv-provisioner
    namespace: openebs-system
