apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: prom-coredns
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: prom
    app.kubernetes.io/version: 93.2.2
    chart: kube-prometheus-stack-93.2.2
    heritage: Helm
    release: kube-prometheus-stack
  name: kube-prom-coredns
  namespace: kube-prometheus-stack-system
spec:
  endpoints:
  - authorization:
      credentials:
        key: token
        name: kube-prom-prometheus-token
      type: Bearer
    port: http-metrics
  jobLabel: jobLabel
  namespaceSelector:
    matchNames:
    - kube-system
  selector:
    matchLabels:
      app: prom-coredns
      release: kube-prometheus-stack
