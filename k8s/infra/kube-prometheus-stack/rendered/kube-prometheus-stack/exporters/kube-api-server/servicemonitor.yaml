apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: prom-apiserver
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: prom
    app.kubernetes.io/version: 93.1.0
    chart: kube-prometheus-stack-93.1.0
    heritage: Helm
    release: kube-prometheus-stack
  name: kube-prom-apiserver
  namespace: kube-prometheus-stack-system
spec:
  endpoints:
  - authorization:
      credentials:
        key: token
        name: kube-prom-prometheus-token
      type: Bearer
    metricRelabelings:
    - action: drop
      regex: .+_bucket
      sourceLabels:
      - __name__
    port: https
    scheme: https
    tlsConfig:
      ca:
        configMap:
          key: ca.crt
          name: kube-root-ca.crt
      insecureSkipVerify: false
      serverName: kubernetes
  jobLabel: component
  namespaceSelector:
    matchNames:
    - default
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
