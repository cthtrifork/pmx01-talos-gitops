# Default deny both ways for the namespace, then what each workload needs (Hubble: the Prometheus pod talks to the
# API server and the scrape targets, kube-state-metrics to the API server, the operator to the API server).
# Node exporter, kubelet, Cilium and Hubble run on the host network, which these policies do not cover; the operator's
# own policy comes from the chart (networkPolicy.flavor: cilium).
#
# Scraping is opt-in by label. A pod that Prometheus scrapes carries `prometheus-scrape: "true"` and is then reachable
# from Prometheus on the ports below (cluster-wide policy), so a namespace does not need its own copy of that rule.
# The label comes from the chart values (prometheusSpec.podMetadata, kube-state-metrics.podLabels) or podLabels of the app.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: prometheus-scrape
spec:
  endpointSelector:
    matchLabels:
      prometheus-scrape: "true"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack-system
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            # zot, the Prometheus config-reloader and the operator-managed exporters, Dependency-Track management,
            # Prometheus itself, the Harper Pad sync and database metrics, the AdGuard exporter
            - { port: "5000", protocol: TCP }
            - { port: "8080", protocol: TCP }
            - { port: "9000", protocol: TCP }
            - { port: "9090", protocol: TCP }
            - { port: "9102", protocol: TCP }
            - { port: "9187", protocol: TCP }
            - { port: "9617", protocol: TCP }
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-prometheus-stack-system-default-deny
  namespace: kube-prometheus-stack-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-prometheus-stack-system-allow-dns-apiserver
  namespace: kube-prometheus-stack-system
spec:
  endpointSelector: {}
  egress:
    # DNS through kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
    # Kubernetes API
    - toEntities:
        - kube-apiserver
---
# Prometheus: scrapes the pods and nodes of the cluster on the metrics ports of the ServiceMonitors and PodMonitors
# (the API server on 6443, kubelet 10250, node exporter 9100, CoreDNS 9153, Cilium 9962 and 9963, Hubble 9965).
# Ingress: the Omni service exposer (host network: arrives as host or remote-node) and claude-rc for queries.
# Prometheus scraping itself is the prometheus-scrape policy above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
  namespace: kube-prometheus-stack-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-system
            k8s:app: claude-rc
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }
  egress:
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - { port: "5000", protocol: TCP }
            - { port: "6443", protocol: TCP }
            - { port: "8080", protocol: TCP }
            - { port: "9000", protocol: TCP }
            - { port: "9090", protocol: TCP }
            - { port: "9100", protocol: TCP }
            - { port: "9102", protocol: TCP }
            - { port: "9153", protocol: TCP }
            - { port: "9187", protocol: TCP }
            - { port: "9617", protocol: TCP }
            - { port: "9962", protocol: TCP }
            - { port: "9963", protocol: TCP }
            - { port: "9965", protocol: TCP }
            - { port: "10250", protocol: TCP }
