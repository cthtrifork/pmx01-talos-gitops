---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: kube-prometheus-stack-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: prometheus-community-kube-prometheus-stack
  driftDetection:
    mode: enabled
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 3
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-state-metrics/values.yaml
  # https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/values.yaml
  values:
    fullnameOverride: kube-prom
    nameOverride: prom
    # Histogram buckets were 104k of 193k series. _sum and _count stay, so averages remain; percentiles of these are gone.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - action: drop
            sourceLabels:
              - __name__
            regex: .+_bucket
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    crds:
      enabled: false
    defaultRules:
      create: false
    alertmanager:
      enabled: false
    prometheusOperator:
      image:
        # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-operator versioning=docker
        tag: v0.95.1@sha256:9c2490af910d58ec2abd77642d340e30bd5e2de5c80fd19ab4b49e28dc7bbb83
      prometheusConfigReloader:
        image:
          # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-config-reloader versioning=docker
          tag: v0.95.2@sha256:cc74ddedad4ab1c49446971f6d51302ad4303d8660a2018af925c7f62c114304
      enabled: true
      # The chart's CiliumNetworkPolicy selects on the version and chart labels, which the pod template does not carry,
      # so it matched no pod. The operator is covered by prom-operator in networkpolicy.yaml.
      networkPolicy:
        enabled: false
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
      admissionWebhooks:
        patch:
          image:
            # renovate: datasource=docker depName=ghcr.io/jkroepke/kube-webhook-certgen versioning=docker
            tag: 1.11.1@sha256:8009b04f9873f7279b5adee37fdd03b6a9aa7b6751d4f69fde2683010e41cd1f
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
    kube-state-metrics:
      image:
        # No digest yet: registry.k8s.io was not reachable when this was written. Renovate pins it (pinDigests).
        # renovate: datasource=docker depName=registry.k8s.io/kube-state-metrics/kube-state-metrics versioning=docker
        tag: v2.20.0
      podLabels:
        prometheus-scrape: "true"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    kubeStateMetrics:
      enabled: true
    grafana:
      enabled: false
    nodeExporter:
      enabled: true
    kubelet:
      enabled: true
      namespace: kube-system
      serviceMonitor:
        enabled: true
        metricRelabelings:
          - action: drop
            sourceLabels:
              - __name__
            regex: .+_bucket
        probesMetricRelabelings:
          - action: drop
            sourceLabels:
              - __name__
            regex: .+_bucket
        kubelet: true
    prometheus-node-exporter:
      image:
        # The chart would append "-distroless" after the digest, so the variant is part of the tag instead.
        distroless: false
        # renovate: datasource=docker depName=quay.io/prometheus/node-exporter versioning=docker
        tag: v1.12.1-distroless@sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 128Mi
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 50m
          memory: 64Mi
    prometheus:
      enabled: true
      podDisruptionBudget:
        enabled: false
      service:
        annotations:
          omni-kube-service-exposer.sidero.dev/label: Prometheus
          omni-kube-service-exposer.sidero.dev/port: "50087"
          omni-kube-service-exposer.sidero.dev/prefix: prometheus
      serviceMonitor:
        selfMonitor: true
      prometheusSpec:
        image:
          # renovate: datasource=docker depName=quay.io/prometheus/prometheus versioning=docker
          tag: v3.16.0-distroless@sha256:9764044e09eb2c9e1abdb12d0f0188d4efb7384b0262d3c080f0fc59045c89ba
        # The operator parses the version from the image tag and rejects the digest and the -distroless suffix
        # ("failed to parse Prometheus version"), which stops every change to the Prometheus resource (rule files,
        # ServiceMonitors). Renovate bumps it together with the tag above.
        # renovate: datasource=docker depName=quay.io/prometheus/prometheus versioning=docker
        version: v3.16.0
        podMetadata:
          labels:
            prometheus-scrape: "true"
        replicas: 1
        enableRemoteWriteReceiver: true
        # OTLP from Claude Code (claude-rc and the Claude VM) on /api/v1/otlp/v1/metrics. Claude Code sends delta
        # counters, which otlp-deltatocumulative turns into cumulative ones (kept in memory: a restart starts them at 0).
        enableOTLPReceiver: true
        enableFeatures:
          - exemplar-storage
          - otlp-deltatocumulative
        otlp:
          translationStrategy: UnderscoreEscapingWithoutSuffixes # claude_code.token.usage -> claude_code_token_usage
          promoteResourceAttributes:
            - environment
        retention: 30d
        retentionSize: 16GiB
        scrapeInterval: 1m
        scrapeTimeout: 1m
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 4Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        additionalConfig:
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                resources:
                  requests:
                    storage: 20Gi

    kubernetesServiceMonitors:
      enabled: true
    global:
      rbac:
        create: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              # Ignore these objects from Flux diff as they are mutated from chart hooks
              kind: (ValidatingWebhookConfiguration|MutatingWebhookConfiguration)
              name: kube-prometheus-stack-admission
            patch: |
              - op: add
                path: /metadata/annotations/helm.toolkit.fluxcd.io~1driftDetection
                value: disabled
