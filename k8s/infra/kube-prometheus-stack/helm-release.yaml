---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: kube-prometheus-stack-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: prometheus-community-kube-prometheus-stack
  driftDetection:
    mode: enabled
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 3
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-state-metrics/values.yaml
  # https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/values.yaml
  values:
    fullnameOverride: kube-prom
    nameOverride: prom
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    crds:
      enabled: false
    defaultRules:
      create: false
    alertmanager:
      enabled: false
    prometheusOperator:
      enabled: true
      networkPolicy:
        enabled: true
        flavor: cilium
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
    kubeStateMetrics:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi
    grafana:
      enabled: false
    nodeExporter:
      enabled: true
    kubelet:
      enabled: true
      namespace: kube-system
      serviceMonitor:
        enabled: true
        kubelet: true
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 128Mi
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 50m
          memory: 64Mi
    prometheus:
      enabled: true
      podDisruptionBudget:
        enabled: false
      service:
        annotations:
          omni-kube-service-exposer.sidero.dev/label: Prometheus
          omni-kube-service-exposer.sidero.dev/port: "50087"
          omni-kube-service-exposer.sidero.dev/prefix: prometheus
      serviceMonitor:
        selfMonitor: true
      prometheusSpec:
        replicas: 1
        enableRemoteWriteReceiver: true
        enableFeatures:
          - exemplar-storage
        retention: 24h
        retentionSize: 1GiB
        scrapeInterval: 1m
        scrapeTimeout: 1m
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 4Gi
        serviceMonitorSelectorNilUsesHelmValues: true
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: true
        podMonitorNamespaceSelector: {}
        additionalConfig:
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                resources:
                  requests:
                    storage: 5Gi

    kubernetesServiceMonitors:
      enabled: true
    global:
      rbac:
        create: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              # Ignore these objects from Flux diff as they are mutated from chart hooks
              kind: (ValidatingWebhookConfiguration|MutatingWebhookConfiguration)
              name: kube-prometheus-stack-admission
            patch: |
              - op: add
                path: /metadata/annotations/helm.toolkit.fluxcd.io~1driftDetection
                value: disabled
