---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: kube-prometheus-stack-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: prometheus-community-kube-prometheus-stack
  driftDetection:
    mode: enabled
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 3
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-state-metrics/values.yaml
  # https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/values.yaml
  values:
    fullnameOverride: kube-prom
    nameOverride: prom
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    crds:
      enabled: false
    defaultRules:
      create: false
    alertmanager:
      enabled: false
    prometheusOperator:
      image:
        # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-operator versioning=docker
        tag: v0.94.2@sha256:c7edf0379b7271ef1705dce258d2bb73820e299cc95559369e9f6fc3321639ec
      prometheusConfigReloader:
        image:
          # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-config-reloader versioning=docker
          tag: v0.94.2@sha256:a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71
      enabled: true
      networkPolicy:
        enabled: true
        flavor: cilium
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
      admissionWebhooks:
        patch:
          image:
            # renovate: datasource=docker depName=ghcr.io/jkroepke/kube-webhook-certgen versioning=docker
            tag: 1.11.1@sha256:8009b04f9873f7279b5adee37fdd03b6a9aa7b6751d4f69fde2683010e41cd1f
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
    kube-state-metrics:
      image:
        # No digest yet: registry.k8s.io was not reachable when this was written. Renovate pins it (pinDigests).
        # renovate: datasource=docker depName=registry.k8s.io/kube-state-metrics/kube-state-metrics versioning=docker
        tag: v2.20.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi
    kubeStateMetrics:
      enabled: true
    grafana:
      enabled: false
    nodeExporter:
      enabled: true
    kubelet:
      enabled: true
      namespace: kube-system
      serviceMonitor:
        enabled: true
        kubelet: true
    prometheus-node-exporter:
      image:
        # The chart would append "-distroless" after the digest, so the variant is part of the tag instead.
        distroless: false
        # renovate: datasource=docker depName=quay.io/prometheus/node-exporter versioning=docker
        tag: v1.12.1-distroless@sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 128Mi
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 50m
          memory: 64Mi
    prometheus:
      enabled: true
      podDisruptionBudget:
        enabled: false
      service:
        annotations:
          omni-kube-service-exposer.sidero.dev/label: Prometheus
          omni-kube-service-exposer.sidero.dev/port: "50087"
          omni-kube-service-exposer.sidero.dev/prefix: prometheus
      serviceMonitor:
        selfMonitor: true
      prometheusSpec:
        image:
          # renovate: datasource=docker depName=quay.io/prometheus/prometheus versioning=docker
          tag: v3.16.0-distroless@sha256:9764044e09eb2c9e1abdb12d0f0188d4efb7384b0262d3c080f0fc59045c89ba
        replicas: 1
        enableRemoteWriteReceiver: true
        enableFeatures:
          - exemplar-storage
        retention: 24h
        retentionSize: 1GiB
        scrapeInterval: 1m
        scrapeTimeout: 1m
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 4Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        additionalConfig:
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                resources:
                  requests:
                    storage: 5Gi

    kubernetesServiceMonitors:
      enabled: true
    global:
      rbac:
        create: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              # Ignore these objects from Flux diff as they are mutated from chart hooks
              kind: (ValidatingWebhookConfiguration|MutatingWebhookConfiguration)
              name: kube-prometheus-stack-admission
            patch: |
              - op: add
                path: /metadata/annotations/helm.toolkit.fluxcd.io~1driftDetection
                value: disabled
