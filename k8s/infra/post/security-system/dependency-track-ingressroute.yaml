# Public path to Dependency-Track. Cloudflare terminates TLS (with an Access policy in front) and forwards through the
# Traefik tunnel to the plain-HTTP "web" entrypoint. The UI and the API are on one origin, so the browser needs no CORS
# (frontend.apiBaseUrl in security-system/dependency-track/helm-release.yaml is this host).
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/traefik.io/ingressroute_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dependency-track
  namespace: security-system
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`dtrack.portableinfo.cloud`) && PathPrefix(`/api`)
      services:
        - name: dependency-track-api-server
          port: web
    - kind: Rule
      match: Host(`dtrack.portableinfo.cloud`)
      services:
        - name: dependency-track-frontend
          port: web
