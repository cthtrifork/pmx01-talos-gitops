---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: storage-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: cnpg
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
  # https://github.com/cloudnative-pg/charts/blob/main/charts/cloudnative-pg/values.yaml
  values:
    image:
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/cloudnative-pg versioning=docker
      tag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
    replicaCount: 1
    priorityClassName: system-cluster-critical
    crds:
      create: true
    config:
      clusterWide: true
   #  data:
   #     INHERITED_LABELS: portableinfo.cloud/*
    monitoring:
      podMonitorEnabled: true
    resources:
      limits:
        memory: 200Mi
      requests:
        cpu: 30m
        memory: 48Mi
