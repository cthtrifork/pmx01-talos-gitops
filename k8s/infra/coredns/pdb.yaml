# CoreDNS is deployed by Talos (2 replicas, preferred anti-affinity), not by a chart, so the PDB lives here.
# Without it a node drain can evict both replicas and cluster DNS goes down.
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/poddisruptionbudget-policy-v1.json
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
