---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitops
  namespace: flux-system
spec:
  interval: 15m # not referenced by any Kustomization; the cluster syncs from the FluxInstance GitRepository
  url: https://github.com/cthtrifork/pmx01-talos-gitops
  ref:
    branch: main
