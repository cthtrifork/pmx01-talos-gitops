---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Mirrors Secrets and ConfigMaps to other namespaces, driven by `reflector.v1.k8s.emberstack.com/*` annotations on the source.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: cert-manager-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: reflector
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
  values:
    image:
      # renovate: datasource=docker depName=docker.io/emberstack/kubernetes-reflector versioning=docker
      tag: 10.0.74@sha256:a4994ed666e69da9ff1777e18067ef89f23ba9e1235e61654559dde9f1e114e5
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
