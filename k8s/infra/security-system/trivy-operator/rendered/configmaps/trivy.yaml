apiVersion: v1
data:
  TRIVY_CACHE_DIR: /home/scanner/.cache/trivy
  TRIVY_DB_REPOSITORY: zot.registry-system.svc.cluster.local:5000/ghcr-cache/aquasecurity/trivy-db
  TRIVY_DEBUG: "false"
  TRIVY_INSECURE: "false"
  TRIVY_JAVA_DB_REPOSITORY: zot.registry-system.svc.cluster.local:5000/ghcr-cache/aquasecurity/trivy-java-db
  TRIVY_LISTEN: 0.0.0.0:4954
  TRIVY_SKIP_DB_UPDATE: "false"
  trivy.additionalVulnerabilityReportFields: ""
  trivy.command: image
  trivy.configFile: |
    ignore-policy: /etc/trivy/ignore-policy.rego
    ignorefile: /etc/trivy/.trivyignore.yaml
    scan:
      disable-telemetry: true
      offline: true
      scanners:
      - vuln
      show-suppressed: false
      skip-version-check: true
    vulnerability:
      ignore-status:
      - will_not_fix
      - not_affected
      severity-source:
      - redhat
      - auto
      vex:
      - repo
  trivy.dbRepository: zot.registry-system.svc.cluster.local:5000/ghcr-cache/aquasecurity/trivy-db
  trivy.dbRepositoryInsecure: "false"
  trivy.filesystemScanCacheDir: /var/trivyoperator/trivy-db
  trivy.ignoreFileName: /etc/trivy/.trivyignore.yaml
  trivy.imagePullPolicy: IfNotPresent
  trivy.imageScanCacheDir: /tmp/trivy/.cache
  trivy.includeDevDeps: "false"
  trivy.javaDbRepository: zot.registry-system.svc.cluster.local:5000/ghcr-cache/aquasecurity/trivy-java-db
  trivy.mode: ClientServer
  trivy.registry.mirror.docker.io: zot.registry-system.svc.cluster.local:5000/docker-hub-cache
  trivy.registry.mirror.ghcr.io: zot.registry-system.svc.cluster.local:5000/ghcr-cache
  trivy.registry.mirror.index.docker.io: zot.registry-system.svc.cluster.local:5000/docker-hub-cache
  trivy.registry.mirror.mirror.gcr.io: zot.registry-system.svc.cluster.local:5000/docker-hub-cache
  trivy.registry.mirror.quay.io: zot.registry-system.svc.cluster.local:5000/quay-cache
  trivy.registry.mirror.registry-1.docker.io: zot.registry-system.svc.cluster.local:5000/docker-hub-cache
  trivy.registry.mirror.registry.k8s.io: zot.registry-system.svc.cluster.local:5000/k8s-cache
  trivy.repository: ghcr.io/aquasecurity/trivy
  trivy.resources.limits.cpu: 500m
  trivy.resources.limits.ephemeral-storage: 2Gi
  trivy.resources.limits.memory: 4Gi
  trivy.resources.requests.cpu: 100m
  trivy.resources.requests.ephemeral-storage: 100Mi
  trivy.resources.requests.memory: 256Mi
  trivy.sbomSources: ""
