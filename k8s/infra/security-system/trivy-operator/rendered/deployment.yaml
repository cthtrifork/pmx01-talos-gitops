apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: trivy-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/version: 0.30.1
    helm.sh/chart: trivy-operator-0.32.1
  name: trivy-operator
  namespace: security-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: trivy-operator
      app.kubernetes.io/name: trivy-operator
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: b5180a663b259bd04463aeaba9ce69ca423f833875f23a0b84ce3d5fbd90a618
      labels:
        app.kubernetes.io/instance: trivy-operator
        app.kubernetes.io/name: trivy-operator
        kube-kraken.dk/mount-root-ca: "true"
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: OPERATOR_NAMESPACE
          value: security-system
        - name: OPERATOR_TARGET_NAMESPACES
          value: ""
        - name: OPERATOR_EXCLUDE_NAMESPACES
          value: local-path-storage,arc-runners-system,arc-controller-system
        - name: OPERATOR_TARGET_WORKLOADS
          value: pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob,job
        - name: OPERATOR_SERVICE_ACCOUNT
          value: trivy-operator
        envFrom:
        - configMapRef:
            name: trivy-operator-config
        image: mirror.gcr.io/aquasec/trivy-operator:0.36.1@sha256:05191a514247ae644dd5cc71306a94f44faff0a6a3fa817235911b911ecebcb9
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /healthz/
            port: probes
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
        name: trivy-operator
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 9090
          name: probes
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz/
            port: probes
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
        resources:
          limits:
            ephemeral-storage: 2Gi
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/ssl/certs/zot-ca.crt
          name: zot-ca
          readOnly: true
          subPath: ca.crt
        - mountPath: /tmp
          name: cache-policies
          readOnly: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: trivy-operator
      tolerations:
      - effect: NoSchedule
        key: kube-kraken/role
        operator: Equal
        value: tool
      volumes:
      - name: zot-ca
        secret:
          secretName: trivy-registry-ca
      - emptyDir:
          sizeLimit: 100Mi
        name: cache-policies
