---
# Operator 0.36.1 (helm-release.yaml) watches PersistentVolumes and PersistentVolumeClaims, which the 0.32.1 chart's
# ClusterRole does not grant: the caches never sync and the operator exits. Chart 0.38.1 (appVersion 0.36.1) adds the
# same two resources to its ClusterRole, but is not published to the OCI registry (the last tag there is 0.32.1).
# Drop this file when the chart is bumped to one that has them.
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/clusterrole-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-operator-storage
rules:
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-operator-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-operator-storage
subjects:
  - kind: ServiceAccount
    name: trivy-operator
    namespace: security-system
