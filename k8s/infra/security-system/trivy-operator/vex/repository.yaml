---
# Trivy VEX repositories, mounted at /.trivy/vex/repository.yaml in the scan jobs (trivy reads ~/.trivy/vex/repository.yaml).
# https://trivy.dev/docs/latest/supply-chain/vex/repo/
repositories:
  # the Trivy VEX hub through the in-cluster mirror (vex-hub/), so the scan jobs do not download from github.com
  - name: default
    url: http://vex-hub.security-system.svc.cluster.local
    enabled: true
  # our own statements: vex/ in this repository (see vex/README.md), also through the mirror
  - name: pmx01-vexhub
    url: http://vex-hub.security-system.svc.cluster.local/pmx01
    enabled: true
