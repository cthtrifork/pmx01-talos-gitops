---
# Receives trivy-operator's webhook broadcast (operator.webhookBroadcastURL) and uploads each SbomReport to
# Dependency-Track as it changes.
# https://aquasecurity.github.io/trivy-operator/v0.30.1/tutorials/integrations/webhook/
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sbom-hook
  namespace: security-system
spec:
  chart:
    spec:
      chart: connect
      version: 3.2.36
      sourceRef:
        kind: HelmRepository
        name: redpanda
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # https://github.com/redpanda-data/helm-charts/blob/main/charts/connect/values.yaml
  values:
    fullnameOverride: sbom-hook
    image:
      repository: mirror.gcr.io/redpandadata/connect
      # renovate: datasource=docker depName=docker.io/redpandadata/connect versioning=docker
      tag: 4.117.0@sha256:b6df7ca0c506578c8cc8b0cd223c117366bbeac84365f95944d339f0165b551c
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 256Mi
    # the image already runs as the non-root user "connect" (uid 10001); make that explicit so it is enforced
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    env:
      - name: DT_API_KEY
        valueFrom:
          secretKeyRef:
            name: dependency-track-api-key
            key: api-key
            optional: true # dry run until config-job has created it, see redpanda-connect.yaml
    deployment:
      podAnnotations:
        reloader.stakater.com/auto: "true" # restart on a change of the config ConfigMap
    # the config is a file of its own (redpanda-connect.yaml), mounted from the generated ConfigMap
    args:
      - -c
      - /etc/connect/redpanda-connect.yaml
      - --disable-telemetry
    extraVolumes:
      - name: tmp
        emptyDir: {}
      - name: connect-config
        configMap:
          name: sbom-hook-connect-config
    extraVolumeMounts:
      - name: tmp
        mountPath: /tmp
      - name: connect-config
        mountPath: /etc/connect/redpanda-connect.yaml
        subPath: redpanda-connect.yaml
        readOnly: true
