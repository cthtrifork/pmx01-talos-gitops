---
# Source: connect/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbom-hook
  namespace: security-system
  labels:
    helm.sh/chart: redpanda-connect-3.2.36
    app.kubernetes.io/name: redpanda-connect
    app.kubernetes.io/instance: sbom-hook
    app.kubernetes.io/version: "4.115.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-connect
      app.kubernetes.io/instance: sbom-hook
  template:
    metadata:
      annotations:
        checksum/config: c2ac0636fd9bfe83e66d48edf864e3f211783ef673cc1454d3f34d736e7727ab
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: redpanda-connect
        app.kubernetes.io/instance: sbom-hook
    spec:
      serviceAccountName: sbom-hook
      restartPolicy: Always
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: connect
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: "mirror.gcr.io/redpandadata/connect:4.116.1@sha256:47ff773082146b6e538c527509af1a736b53063e68f0eb1266253a0832b39396"
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /etc/connect/redpanda-connect.yaml
            - --disable-telemetry
          ports:
            - name: http
              containerPort: 4195
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 2
          readinessProbe:
            failureThreshold: 1
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 2
          env:
            - name: DT_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: dependency-track-api-key
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: "/redpanda-connect.yaml"
              subPath: "redpanda-connect.yaml"
              readOnly: true
            - mountPath: /etc/connect/redpanda-connect.yaml
              name: connect-config
              readOnly: true
              subPath: redpanda-connect.yaml
      volumes:
        - name: config
          configMap:
            name: sbom-hook-config
        - configMap:
            name: sbom-hook-connect-config
          name: connect-config
