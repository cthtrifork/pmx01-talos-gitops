apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: dependency-track
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: dependency-track-frontend
    app.kubernetes.io/part-of: dependency-track
    app.kubernetes.io/version: 5.2.1
    helm.sh/chart: dependency-track-2.9.0
  name: dependency-track-frontend
  namespace: security-system
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      app.kubernetes.io/instance: dependency-track
      app.kubernetes.io/name: dependency-track-frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/instance: dependency-track
        app.kubernetes.io/name: dependency-track-frontend
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: API_BASE_URL
          value: http://192.168.1.242:8080
        image: mirror.gcr.io/dependencytrack/frontend:5.2.1@sha256:1c0f63b083af8e89ff4ede5e7ed5cfc4e23ab871fa140ed101e8dc56f53eb51c
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /static/config.json
            port: web
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        name: frontend
        ports:
        - containerPort: 8080
          name: web
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /static/config.json
            port: web
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 150m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/nginx/conf.d
          name: nginx-conf
        - mountPath: /opt/owasp/dependency-track-frontend/static/config.json
          name: frontend-config
          readOnly: true
          subPath: config.json
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      serviceAccountName: dependency-track
      volumes:
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: nginx-conf
      - configMap:
          name: dependency-track-frontend-config
        name: frontend-config
