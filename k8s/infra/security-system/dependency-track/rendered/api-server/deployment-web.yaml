apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: api-server
    app.kubernetes.io/instance: dependency-track
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: dependency-track-api-server
    app.kubernetes.io/part-of: dependency-track
    app.kubernetes.io/version: 5.2.1
    dependencytrack.io/role: web
    helm.sh/chart: dependency-track-2.9.0
  name: dependency-track-api-server
  namespace: security-system
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: api-server
      app.kubernetes.io/instance: dependency-track
      app.kubernetes.io/name: dependency-track-api-server
      dependencytrack.io/role: web
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api-server
        app.kubernetes.io/instance: dependency-track
        app.kubernetes.io/name: dependency-track-api-server
        dependencytrack.io/role: web
        prometheus-scrape: "true"
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: DT_METRICS_ENABLED
          value: "true"
        - name: DT_MANAGEMENT_PORT
          value: "9000"
        - name: DT_DATASOURCE_URL
          value: jdbc:postgresql://dependency-track-db-rw.security-system.svc.cluster.local:5432/dtrack
        - name: DT_DATASOURCE_USERNAME
          value: ${file::/etc/dt/secrets/db/username}
        - name: DT_DATASOURCE_PASSWORD
          value: ${file::/etc/dt/secrets/db/password}
        - name: DT_SECRET_MANAGEMENT_PROVIDER
          value: database
        - name: DT_SECRET_MANAGEMENT_DATABASE_KEK
          value: ${file::/etc/dt/secrets/sm/database/kek/kek}
        - name: DT_FILE_STORAGE_PROVIDER
          value: local
        - name: DT_FILE_STORAGE_LOCAL_DIRECTORY
          value: /data
        image: mirror.gcr.io/dependencytrack/apiserver:5.2.1@sha256:a7ce7a42928c6c03e94e8255e2ee871f5268f55b638a69729cae7afc47ef43b8
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: management
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        name: api-server
        ports:
        - containerPort: 8080
          name: web
          protocol: TCP
        - containerPort: 9000
          name: management
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: management
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /health/started
            port: management
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/dt/secrets/db
          name: db-secret
          readOnly: true
        - mountPath: /etc/dt/secrets/sm/database/kek
          name: sm-database-kek
          readOnly: true
        - mountPath: /data
          name: file-storage
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      serviceAccountName: dependency-track
      terminationGracePeriodSeconds: 120
      volumes:
      - emptyDir: {}
        name: tmp
      - name: db-secret
        secret:
          defaultMode: 292
          items:
          - key: username
            path: username
          - key: password
            path: password
          secretName: dependency-track-db-app
      - name: sm-database-kek
        secret:
          defaultMode: 292
          items:
          - key: kek
            path: kek
          secretName: dependency-track-kek
      - name: file-storage
        persistentVolumeClaim:
          claimName: dependency-track-storage
