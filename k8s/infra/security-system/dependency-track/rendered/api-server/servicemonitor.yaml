apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/component: api-server
    app.kubernetes.io/instance: dependency-track
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: dependency-track-api-server
    app.kubernetes.io/part-of: dependency-track
    app.kubernetes.io/version: 5.2.1
    helm.sh/chart: dependency-track-2.9.0
  name: dependency-track-api-server-metrics
  namespace: security-system
spec:
  endpoints:
  - interval: 60s
    metricRelabelings:
    - action: drop
      regex: .+_bucket
      sourceLabels:
      - __name__
    path: /metrics
    port: management
    scrapeTimeout: 30s
  namespaceSelector:
    matchNames:
    - security-system
  podTargetLabels:
  - dependencytrack.io/role
  selector:
    matchLabels:
      app.kubernetes.io/component: api-server
      app.kubernetes.io/instance: dependency-track
      app.kubernetes.io/name: dependency-track-api-server
