---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dependency-track
  namespace: security-system
spec:
  chartRef:
    kind: OCIRepository
    name: dependency-track
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  install:
    disableWait: true
    strategy:
      name: RetryOnFailure
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  # https://github.com/DependencyTrack/helm-charts/blob/main/charts/dependency-track/values.yaml
  values:
    image:
      registry: mirror.gcr.io
    database:
      # -rw is the CNPG read-write service of postgres-cluster.yaml
      jdbcUrl: "jdbc:postgresql://dependency-track-db-rw.security-system.svc.cluster.local:5432/dtrack"
      existingSecret:
        name: dependency-track-db-app # created by CNPG
    secretManagement:
      database:
        kek:
          # Not generated by the chart; created once by the Job in kek-job.yaml.
          existingSecret:
            name: dependency-track-kek
            key: kek
    fileStorage:
      provider: local
      local:
        size: 5Gi
        storageClassName: ${DEFAULT_STORAGE_CLASS:=local-path}
    apiServer:
      image:
        # renovate: datasource=docker depName=mirror.gcr.io/dependencytrack/apiserver versioning=semver
        tag: 5.2.1@sha256:a7ce7a42928c6c03e94e8255e2ee871f5268f55b638a69729cae7afc47ef43b8
      serviceMonitor:
        enabled: true
        namespace: security-system
      web:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
      worker:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
    frontend:
      image:
        # renovate: datasource=docker depName=mirror.gcr.io/dependencytrack/frontend versioning=semver
        tag: 5.2.1@sha256:1c0f63b083af8e89ff4ede5e7ed5cfc4e23ab871fa140ed101e8dc56f53eb51c
      # The SPA calls the API from the browser, so this is the LAN address of dependency-track-api-server-lb (service-lb.yaml).
      apiBaseUrl: "http://192.168.1.242:8080"
      # Read-only root filesystem. The image's entrypoint hooks normally write two things at start: the nginx site config
      # into /etc/nginx/conf.d (an emptyDir is enough, the template stays in the image) and API_BASE_URL etc. into
      # static/config.json. The second hook skips itself when it cannot modify the file, so config.json is mounted from a
      # ConfigMap instead; its content is the "effective config" the hook logged on the old writable setup. It repeats
      # apiBaseUrl above: keep the two in step (frontend-config.json).
      podAnnotations:
        reloader.stakater.com/auto: "true" # restart on a change of the config ConfigMap
      securityContext:
        readOnlyRootFilesystem: true
      additionalVolumes:
        - name: nginx-conf
          emptyDir: {}
        - name: frontend-config
          configMap:
            name: dependency-track-frontend-config
      additionalVolumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
        - name: frontend-config
          mountPath: /opt/owasp/dependency-track-frontend/static/config.json
          subPath: config.json
          readOnly: true
