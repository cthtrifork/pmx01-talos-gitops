---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dependency-track
  namespace: security-system
spec:
  chartRef:
    kind: OCIRepository
    name: dependency-track
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  install:
    disableWait: true
    strategy:
      name: RetryOnFailure
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  # https://github.com/DependencyTrack/helm-charts/blob/main/charts/dependency-track/values.yaml
  values:
    database:
      # -rw is the CNPG read-write service of postgres-cluster.yaml
      jdbcUrl: "jdbc:postgresql://dependency-track-db-rw.security-system.svc.cluster.local:5432/dtrack"
      existingSecret:
        name: dependency-track-db-app # created by CNPG
    secretManagement:
      database:
        kek:
          # Not generated by the chart. Provide a SOPS-encrypted Secret named dependency-track-kek with the key `kek`
          # (openssl rand -base64 32); see README.md.
          existingSecret:
            name: dependency-track-kek
            key: kek
    fileStorage:
      provider: local
      local:
        size: 5Gi
        storageClassName: ${DEFAULT_STORAGE_CLASS:=local-path}
    apiServer:
      serviceMonitor:
        enabled: true
        namespace: security-system
      web:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
      worker:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
    frontend:
      # The SPA calls the API from the browser, so this is the LAN address of dependency-track-api-server-lb (service-lb.yaml).
      apiBaseUrl: "http://192.168.1.242:8080"
