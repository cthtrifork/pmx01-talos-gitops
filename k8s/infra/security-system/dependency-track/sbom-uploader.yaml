# Uploads the SBOMs that trivy-operator generates (SbomReport, a CycloneDX BOM) to Dependency-Track, one project per
# image (<registry>/<repository>, version = tag or digest), so Dependency-Track can analyse them and flag KEV.
# Needs the Secret dependency-track-api-key (key `api-key`), created by hand: an API key of a team with the permissions
# BOM_UPLOAD and PROJECT_CREATION_UPLOAD (Administration > Access Management > Teams in the UI).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dependency-track-sbom-uploader
  namespace: security-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-track-sbom-uploader
rules:
  - apiGroups:
      - "aquasecurity.github.io"
    resources:
      - "sbomreports"
    verbs:
      - "get"
      - "list"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-track-sbom-uploader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-track-sbom-uploader
subjects:
  - kind: ServiceAccount
    name: dependency-track-sbom-uploader
    namespace: security-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dependency-track-sbom-uploader
  namespace: security-system
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: dependency-track-sbom-uploader
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: upload
              image: mirror.gcr.io/alpine/k8s:1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
              command:
                - sh
                - -eu
                - -c
                - |
                  if [ -z "$API_KEY" ]; then
                    echo "Secret dependency-track-api-key (key api-key) is missing or empty" >&2
                    exit 1
                  fi
                  cd /work
                  # one line per SbomReport: namespace name server repository tag digest
                  kubectl get sbomreports -A -o json --chunk-size=50 |
                    jq -r '.items[] | [.metadata.namespace, .metadata.name, (.report.registry.server // "-"),
                      .report.artifact.repository, (.report.artifact.tag // "-"), (.report.artifact.digest // "-")] | @tsv' \
                    > list.tsv
                  # the same image runs in many workloads: upload each repository:tag once
                  sort -u -t "$(printf '\t')" -k3,3 -k4,4 -k5,5 list.tsv > unique.tsv
                  ok=0; failed=0
                  while IFS="$(printf '\t')" read -r ns name server repo tag digest; do
                    project="$repo"; [ "$server" != "-" ] && project="$server/$repo"
                    version="$tag"; [ "$tag" = "-" ] && version="$digest"
                    kubectl get sbomreport -n "$ns" "$name" -o json | jq '.report.components' > bom.json
                    if curl -sS -f -o /dev/null -X POST "$DT_URL/api/v1/bom" \
                        -H "X-Api-Key: $API_KEY" \
                        -F autoCreate=true -F "projectName=$project" -F "projectVersion=$version" \
                        -F projectTags=kubernetes -F bom=@bom.json; then
                      ok=$((ok+1))
                    else
                      echo "upload failed: $project:$version ($ns/$name)" >&2
                      failed=$((failed+1))
                    fi
                  done < unique.tsv
                  echo "uploaded $ok, failed $failed"
                  [ "$failed" -eq 0 ]
              env:
                - name: HOME
                  value: /work
                - name: DT_URL
                  value: http://dependency-track-api-server.security-system.svc.cluster.local:8080
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: dependency-track-api-key
                      key: api-key
                      optional: true
              volumeMounts:
                - { name: work, mountPath: /work }
              resources:
                requests: { cpu: 20m, memory: 128Mi }
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 256Mi
