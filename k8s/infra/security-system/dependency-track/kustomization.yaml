---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kek-job.yaml
  - config-job.yaml
  - vex-export.yaml
  - service-lb.yaml
  - helm-release.yaml
  - helm-repository.yaml
configMapGenerator:
  - name: dependency-track-frontend-config
    namespace: security-system
    files:
      - config.json=frontend-config.json
  - name: dependency-track-frontend-nginx
    namespace: security-system
    files:
      - default.conf.template=nginx-default.conf.template
generatorOptions:
  disableNameSuffixHash: true # the helm values refer to the ConfigMap by name; Reloader restarts the pod on a change
