---
# Serves a copy of the Trivy VEX hub to the scan jobs; see redpanda-connect.yaml. Used by trivy-operator/vex/repository.yaml.
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vex-hub
  namespace: security-system
spec:
  chart:
    spec:
      chart: connect
      version: 3.2.36
      sourceRef:
        kind: HelmRepository
        name: redpanda # defined in sbom-hook/helm-repository.yaml
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # https://github.com/redpanda-data/helm-charts/blob/main/charts/connect/values.yaml
  values:
    fullnameOverride: vex-hub
    image:
      repository: mirror.gcr.io/redpandadata/connect
      # renovate: datasource=docker depName=docker.io/redpandadata/connect versioning=docker
      tag: 4.116.1@sha256:47ff773082146b6e538c527509af1a736b53063e68f0eb1266253a0832b39396
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    deployment:
      podAnnotations:
        reloader.stakater.com/auto: "true" # restart on a change of the config ConfigMap
    # the config is a file of its own (redpanda-connect.yaml), mounted from the generated ConfigMap
    args:
      - -c
      - /etc/connect/redpanda-connect.yaml
      - --disable-telemetry
    extraVolumes:
      - name: connect-config
        configMap:
          name: vex-hub-connect-config
    extraVolumeMounts:
      - name: connect-config
        mountPath: /etc/connect/redpanda-connect.yaml
        subPath: redpanda-connect.yaml
        readOnly: true
