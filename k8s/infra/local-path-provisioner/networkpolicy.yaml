# Default deny both ways for the namespace, then DNS and the Kubernetes API for the provisioner.
# The short-lived helper pods it starts to create and delete volume directories need no network.
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: local-path-storage-default-deny
  namespace: local-path-storage
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: local-path-storage-allow-dns-apiserver
  namespace: local-path-storage
spec:
  endpointSelector: {}
  egress:
    # DNS through kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
    # Kubernetes API
    - toEntities:
        - kube-apiserver
