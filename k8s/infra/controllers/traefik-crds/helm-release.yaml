# Only the Traefik CRDs, so that IngressRoutes and Middlewares can be applied without waiting for the Traefik pod
# (which needs a Cloudflare tunnel token). The traefik release skips CRDs. Helm adopts the CRDs that already exist.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-crds
  namespace: traefik-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: traefik-crds
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
