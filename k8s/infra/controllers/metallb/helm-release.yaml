# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: metallb
  driftDetection:
    mode: enabled
  # https://github.com/metallb/metallb/blob/main/charts/metallb/values.yaml
  values:
    crds:
      enabled: true
    frr-k8s:
      frrk8s:
        image:
          # renovate: datasource=docker depName=quay.io/metallb/frr-k8s versioning=docker
          tag: v0.0.27@sha256:de862b74a3a314eb76c8fb4cabc9d2c55cca51002cd022704c32df717f9366b7
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 5m
            memory: 16Mi
        frr:
          image:
            # renovate: datasource=docker depName=quay.io/frrouting/frr versioning=docker
            tag: 10.7.1@sha256:e995beaa50fdc9edb35eadcfefa29b7f062cc06f2b812613789b68fa541554d2
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 5m
              memory: 32Mi
        reloader:
          resources:
            limits:
              memory: 32Mi
            requests:
              cpu: 5m
              memory: 8Mi
        frrMetrics:
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 10m
              memory: 16Mi
        frrStatus:
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 5m
              memory: 16Mi
      prometheus:
        serviceMonitor:
          enabled: false
    controller:
      image:
        # renovate: datasource=docker depName=quay.io/metallb/controller versioning=docker
        tag: v0.16.2@sha256:34a6f107f29c4fc6e9d084a7f3bdb781aae7b5ee2b534195a2775ab68c09c503
      tolerations:
        # Tolerate the control plane taint
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 128Mi
    speaker:
      image:
        # renovate: datasource=docker depName=quay.io/metallb/speaker versioning=docker
        tag: v0.16.2@sha256:01666518b091a6651d68891c802db84b2219495d7e0e41c2e61c46f9976be231
      tolerations:
        # Tolerate the control plane taint
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 25m
          memory: 128Mi
