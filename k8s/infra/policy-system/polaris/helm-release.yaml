---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polaris
  namespace: policy-system
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: polaris
      version: 6.0.1
      sourceRef:
        name: fairwinds
        kind: HelmRepository
        namespace: policy-system
  driftDetection:
    mode: enabled
  # https://github.com/FairwindsOps/charts/blob/master/stable/polaris/values.yaml
  values:
    image:
      repository: quay.io/fairwinds/polaris
      pullPolicy: IfNotPresent
      # renovate: datasource=docker depName=quay.io/fairwinds/polaris versioning=docker
      tag: 10.1.8@sha256:7af688527df75c3825395ded8aeb3775fad2027228aa06c9959d39ae6c00e999
    rbac:
      enabled: true
    dashboard:
      replicas: 1
      service:
        annotations:
          omni-kube-service-exposer.sidero.dev/label: "Polaris"
          omni-kube-service-exposer.sidero.dev/port: "50088"
          omni-kube-service-exposer.sidero.dev/prefix: polaris
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 128Mi
      containerSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    mergeConfig: true
    config:
      # This config file is merged with the default config file provided by Polaris
      # You should only include the keys and values that you want to override
      checks:
        # reliability
        priorityClassNotSet: ignore
        # PDBs do not help at one replica per workload
        missingPodDisruptionBudget: ignore
        pullPolicyNotAlways: ignore
        # single-node-class home cluster: these fire on almost every controller
        deploymentMissingReplicas: ignore
        metadataAndInstanceMismatched: ignore
        topologySpreadConstraint: ignore

        # security
        linuxHardening: danger
        # most pods need the token; the ones that do not are not worth a per-pod exemption
        automountServiceAccountToken: ignore
        missingNetworkPolicy: ignore

        # efficiency
        cpuLimitsMissing: ignore
      exemptions:
        # Ignore checks for cilium and hubble
        - namespace: kube-system
          controllerNames:
            - cilium
            - hubble-ui
            - hubble-relay
          rules: []
        # ignore checks for etcd, kube-apiserver, kube-controller-manager, kube-scheduler in kube-system namespace
        - namespace: kube-system
          containerNames:
            - etcd
            - kube-apiserver
            - kube-controller-manager
            - kube-scheduler
          rules: []
        # Ignore checks for flux
        - namespace: flux-system
          controllerNames:
            - helm-controller
            - kustomize-controller
            - notification-controller
            - source-controller
          rules: []
        # Cluster-admin and pods/exec by design: Flux reconciles everything, the CNPG operator execs into its database pods
        - controllerNames:
            - cluster-reconciler-flux-system
            - flux-operator
            - flux-operator-cluster-admin
            - flux-web-admin
            - flux-web-user
            - cloudnative-pg
          rules:
            - clusterrolebindingClusterAdmin
            - clusterrolebindingPodExecAttach
            - clusterrolePodExecAttach
        # Host-level components: they need the host network, host paths and extra capabilities to do their job
        - controllerNames:
            - kube-apiserver
            - kube-controller-manager
            - kube-scheduler
          rules:
            - hostNetworkSet
            - hostPIDSet
            - hostPathSet
            - dangerousCapabilities
            - insecureCapabilities
        # node-exporter reads the host's /proc, /sys and / over the host network and PID namespace; no capabilities
        - controllerNames:
            - kube-prometheus-stack-prometheus-node-exporter
          rules:
            - hostNetworkSet
            - hostPIDSet
            - hostPathSet
        # MetalLB speaker announces addresses from the host network; adds NET_RAW only
        - controllerNames:
            - metallb-speaker
          rules:
            - hostNetworkSet
            - insecureCapabilities
        # frr-k8s runs BGP on the host network; the frr container adds NET_ADMIN and SYS_ADMIN
        - controllerNames:
            - metallb-frr-k8s
          rules:
            - hostNetworkSet
            - dangerousCapabilities
            - insecureCapabilities
        # The Omni service exposer listens on the host network (managed by Omni)
        - controllerNames:
            - omni-kube-service-exposer
          rules:
            - hostNetworkSet
        # spegel mounts the containerd socket, content store and registry hosts config from the node
        - controllerNames:
            - spegel
          rules:
            - hostPathSet
        # Docker-in-Docker CI runner: privileged and root by design, isolated to its own namespace
        - namespace: arc-runners-system
          controllerNames:
            - arc-ubuntu-runner
          rules:
            - runAsPrivileged
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - insecureCapabilities
            - notReadOnlyRootFilesystem
            - hostPathSet
        # Keyword false positives: names and file paths such as METALLB_ML_SECRET_NAME, STAKATER_*_SECRET and
        # DT_DATASOURCE_PASSWORD with a file reference; the credentials themselves come from secretKeyRef or mounted files
        - controllerNames:
            - metallb-speaker
            - metallb-controller
            - zot
            - harper-pad-admin
            - traefik
            - dependency-track-api-server
            - adguard-deployment
          rules:
            - sensitiveContainerEnvVar
        # Keyword false positives: ConfigMaps whose keys or scripts mention "token" or "secret", but hold no credentials
        - controllerNames:
            - claude-token-scripts
            - talos-bootstrap-manifests-inventory
            - trivy-operator-config
          rules:
            - sensitiveConfigmapContent
        # Controllers that serve no traffic, and pods generated by operators whose chart has no probe values (cert-manager
        # controller readiness, cainjector, ARC listener and runner pods)
        # cert-manager chart: the controller has no readiness probe value and cainjector has no probe values at all
        - controllerNames:
            - cert-manager
            - cert-manager-cainjector
          rules:
            - readinessProbeMissing
            - livenessProbeMissing
        # Generated ARC listener and runner pods: no probe values, and the runner needs a writable root filesystem
        - controllerNames:
            - arc-ubuntu
          rules:
            - readinessProbeMissing
            - livenessProbeMissing
            - notReadOnlyRootFilesystem
        # Run as root by design or are managed outside this repo: coredns (Talos), spegel (containerd mirror),
        # MetalLB (speaker and frr-k8s need raw sockets and file ownership), the Omni service exposer (managed by Omni)
        # Root with no seccomp profile set (coredns is managed by Talos); the rest of their hardening is in place
        - controllerNames:
            - coredns
            - metallb-speaker
          rules:
            - runAsRootAllowed
            - linuxHardening
        # spegel is hardened (seccomp, read-only root) but runs as root to use the containerd socket; its chart has no liveness probe value
        - controllerNames:
            - spegel
          rules:
            - runAsRootAllowed
            - livenessProbeMissing
        # frr-k8s (several containers) and the Omni exposer (manifest generated by Omni) are not hardened or probed
        - controllerNames:
            - metallb-frr-k8s
            - omni-kube-service-exposer
          rules:
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - notReadOnlyRootFilesystem
            - livenessProbeMissing
            - readinessProbeMissing
        # The Omni service exposer's manifest is generated by Omni, so its resources cannot be set from here
        - controllerNames:
            - omni-kube-service-exposer
          rules:
            - cpuRequestsMissing
            - memoryRequestsMissing
            - memoryLimitsMissing
        # No health endpoint to probe: claude-rc has none, and the harper-pad-admin app listens on loopback only with no shell
        # or health command in its image (see its manifest). The cloudflared sidecars are probed with `cloudflared tunnel ready`.
        - controllerNames:
            - claude-rc
          rules:
            - livenessProbeMissing
            - readinessProbeMissing
        # harper-pad-admin app container only (the cloudflared sidecar has probes)
        - controllerNames:
            - harper-pad-admin
          containerNames:
            - admin
          rules:
            - livenessProbeMissing
            - readinessProbeMissing
        # Storage provisioners, deliberately not hardened yet: they create and chmod host directories for every PVC, directly
        # (openebs) or through the helper pods they launch (local-path), and a wrong security context would stop all
        # provisioning. Revisit once there is a way to test it on a throwaway PVC.
        - controllerNames:
            - local-path-provisioner
            - openebs-localpv-localpv-provisioner
          rules:
            - runAsRootAllowed
            - privilegeEscalationAllowed
            - linuxHardening
            - insecureCapabilities
            - notReadOnlyRootFilesystem
        # adguard-home runs non-root with only NET_BIND_SERVICE, but its binary's file capability needs
        # allowPrivilegeEscalation (no_new_privs off) to take effect; see the comment in its Deployment
        - controllerNames:
            - adguard-deployment
          rules:
            - privilegeEscalationAllowed
