---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: policy-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: reloader
  driftDetection:
    mode: enabled
  # https://github.com/stakater/Reloader/blob/master/deployments/kubernetes/chart/reloader/values.yaml
  install:
    strategy:
      name: RetryOnFailure
  values:
    reloader:
      image:
        # renovate: datasource=docker depName=ghcr.io/stakater/reloader versioning=docker
        tag: v1.4.23@sha256:82c80a15fdba22f738642553159f9fb37baf9e4d1edfeb798e8c48d87767f410
      #matchLabels:
      #  kyverno.io/watch: "true"
      watchGlobally: true
      deployment:
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
