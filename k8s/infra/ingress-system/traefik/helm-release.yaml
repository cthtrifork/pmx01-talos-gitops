# Cluster ingress. Nothing is exposed on the LAN: a Cloudflare tunnel (cloudflared sidecar in the Traefik
# pod) carries public traffic in, and Cloudflare owns DNS and TLS. In the Cloudflare Zero Trust dashboard,
# create a remotely managed tunnel whose public hostnames point at http://localhost:8000 (the "web"
# entrypoint below) and store its token as the SOPS-encrypted Secret `cloudflared-tunnel-token` (key `token`) in this
# namespace (see "Secrets (SOPS)" in the root readme.md).
# Routing and middlewares live with each app (IngressRoute).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: traefik
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
  values:
    image:
      registry: mirror.gcr.io
      repository: library/traefik
      # renovate: datasource=docker depName=mirror.gcr.io/library/traefik versioning=docker
      tag: v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    deployment:
      replicas: 1
      annotations:
        reloader.stakater.com/auto: "true" # restart when the tunnel token Secret changes
      additionalContainers:
        # A regular (not native) sidecar: if the token is missing only the tunnel restarts, Traefik stays up.
        - name: cloudflared
          image: mirror.gcr.io/cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
          args:
            - "tunnel"
            - "--no-autoupdate"
            - "--metrics"
            - "127.0.0.1:2000"
            - "run"
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - "ALL"
    service:
      spec:
        type: ClusterIP # reached through the tunnel only
    ports:
      web:
        port: 8000
        exposedPort: 80
        forwardedHeaders:
          # cloudflared connects from loopback; keep the client address headers Cloudflare set
          trustedIPs:
            - 127.0.0.1/32
      websecure:
        expose:
          default: false # TLS ends at Cloudflare
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: false
      kubernetesIngress:
        enabled: false
    ingressRoute:
      dashboard:
        enabled: false
    log:
      level: INFO
    accessLog:
      enabled: false # request bodies and queries stay out of logs
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
