---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
  namespace: registry-system
spec:
  chartRef:
    kind: OCIRepository
    name: spegel
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  install:
    disableWait: true
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  # https://github.com/spegel-org/spegel/blob/main/charts/spegel/values.yaml
  values:
    spegel:
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
      # the Talos zot mirrors (patches/11-zot-mirrors.yaml); an empty list replaces them all with one _default mirror
      mirroredRegistries:
        - https://docker.io
        - https://mirror.gcr.io
        - https://ghcr.io
        - https://gcr.io
        - https://registry.k8s.io
        - https://quay.io
        - https://us-docker.pkg.dev
      # keep the Talos mirror hosts after Spegel: Spegel, then zot, then the upstream registry; restart the pods after a Talos registry patch (docs/registry-mirrors.md)
      prependExisting: true
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
      labels:
        grafana_dashboard: "1"
    # podSecurityContext:
    #   runAsNonRoot: false
    #   runAsUser: &uid 0
    #   runAsGroup: *uid
    #   fsGroup: *uid
    #   fsGroupChangePolicy: OnRootMismatch
    #   seccompProfile:
    #     type: RuntimeDefault

    livenessProbe:
      enabled: true
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - "ALL"
      seccompProfile:
        type: RuntimeDefault
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 256Mi
