---
# Source: spegel/templates/post-delete-hook.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spegel-cleanup
  namespace: registry-system
  labels:
    app.kubernetes.io/component: cleanup
    helm.sh/chart: spegel-0.8.1
    app.kubernetes.io/name: spegel
    app.kubernetes.io/instance: spegel
    app.kubernetes.io/version: "v0.8.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: "post-delete"
    helm.sh/hook-delete-policy: "before-hook-creation, hook-succeeded"
    helm.sh/hook-weight: "0"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: cleanup
      app.kubernetes.io/name: spegel
      app.kubernetes.io/instance: spegel
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cleanup
        app.kubernetes.io/name: spegel
        app.kubernetes.io/instance: spegel
    spec:
      securityContext: {}
      priorityClassName: system-node-critical
      containers:
        - name: cleanup
          image: "ghcr.io/spegel-org/spegel@sha256:bdc1d14e4ab76e9a74520d331f485d09a596110118bd1a7706fa0411f17b3703"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          args:
            - cleanup
            - --containerd-registry-config-path=/etc/cri/conf.d/hosts
            - --addr=:8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: readiness
          ports:
            - name: readiness
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: containerd-config
              mountPath: /etc/cri/conf.d/hosts
      volumes:
        - name: containerd-config
          hostPath:
            path: /etc/cri/conf.d/hosts
            type: DirectoryOrCreate
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoExecute
          operator: Exists
        - effect: NoSchedule
          operator: Exists
---
# Source: spegel/templates/post-delete-hook.yaml
apiVersion: v1
kind: Pod
metadata:
  name: spegel-cleanup-wait
  namespace: registry-system
  labels:
    app.kubernetes.io/component: cleanup-wait
    helm.sh/chart: spegel-0.8.1
    app.kubernetes.io/name: spegel
    app.kubernetes.io/instance: spegel
    app.kubernetes.io/version: "v0.8.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: "post-delete"
    helm.sh/hook-delete-policy: "before-hook-creation, hook-succeeded"
    helm.sh/hook-weight: "1"
spec:
  securityContext: {}
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - effect: NoExecute
      operator: Exists
    - effect: NoSchedule
      operator: Exists
  containers:
    - name: cleanup-wait
      image: "ghcr.io/spegel-org/spegel@sha256:bdc1d14e4ab76e9a74520d331f485d09a596110118bd1a7706fa0411f17b3703"
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      args:
        - cleanup-wait
        - --probe-endpoint=spegel-cleanup.registry-system.svc.cluster.local.:8080
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
