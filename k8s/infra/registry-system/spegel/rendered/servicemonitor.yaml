metadata:
  name: spegel
  namespace: registry-system
  labels:
    helm.sh/chart: spegel-0.8.1
    app.kubernetes.io/name: spegel
    app.kubernetes.io/instance: spegel
    app.kubernetes.io/version: "v0.8.1"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics
      app.kubernetes.io/name: spegel
      app.kubernetes.io/instance: spegel
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
