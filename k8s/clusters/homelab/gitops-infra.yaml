# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-infra
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 30m
  retryInterval: 2m
  prune: true
  dependsOn:
    - name: gitops-infra-bootstrap
    - name: gitops-infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ../../k8s/infra
  postBuild:
    substitute:
      var_substitution_enabled: "true"
