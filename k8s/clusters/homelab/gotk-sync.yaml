# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-infra-bootstrap
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m # heal ordering races and transient failures without waiting for the interval
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system #gitops
  path: ../../k8s/infra/bootstrap
  wait: true # gitops-infra applies PrometheusRules and ServiceMonitors, which need the CRDs of prometheus-operator-crds
  timeout: 5m
  postBuild:
    substitute:
      var_substitution_enabled: "true"
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-infra-controllers
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m # heal ordering races and transient failures without waiting for the interval
  prune: true
  wait: true # cert-manager, trust-manager, MetalLB, CloudNativePG and Traefik, which install the CRDs and webhooks that later layers use
  timeout: 10m
  dependsOn:
    - name: gitops-infra-bootstrap
  sourceRef:
    kind: GitRepository
    name: flux-system #gitops
  path: ../../k8s/infra/controllers
  postBuild:
    substitute:
      var_substitution_enabled: "true"
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-infra
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 30m
  retryInterval: 2m # heal ordering races and transient failures without waiting for the interval
  prune: true
  dependsOn:
    - name: gitops-infra-bootstrap
    - name: gitops-infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system #gitops
  path: ../../k8s/infra
  postBuild:
    substitute:
      var_substitution_enabled: "true"
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-infra-post
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m # heal ordering races and transient failures without waiting for the interval
  prune: true
  wait: true # app-controllers and app need the issuers, the MetalLB pool and the CNPG cluster
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: gitops-infra
  sourceRef:
    kind: GitRepository
    name: flux-system #gitops
  path: ../../k8s/infra/post
  postBuild:
    substitute:
      var_substitution_enabled: "true"
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-controllers
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m # heal ordering races and transient failures without waiting for the interval
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: gitops-infra-post
  sourceRef:
    kind: GitRepository
    name: flux-system #gitops
  path: ../../k8s/apps/controllers
  postBuild:
    substitute:
      var_substitution_enabled: "true"
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m # heal ordering races and transient failures without waiting for the interval
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: gitops-infra-post
    - name: app-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system #gitops
  path: ../../k8s/apps
  postBuild:
    substitute:
      var_substitution_enabled: "true"
