# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-virtualmachines
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  prune: true
  dependsOn:
    - name: gitops-infra-post
  sourceRef:
    kind: GitRepository
    name: flux-system #gitops
  path: ../../k8s/virtualmachines
  postBuild:
    substitute:
      var_substitution_enabled: "true"
